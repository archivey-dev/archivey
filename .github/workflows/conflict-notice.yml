name: Conflict notice

# Says so on a pull request when it stops merging cleanly into `main`.
#
# GitHub starts no `pull_request` workflow run for a conflicted pull request: a push to
# the branch starts no CI, and adding the `review` label starts no review round. Nothing
# fails and nothing is posted, so the agent watching the pull request waits for a
# closing comment or a CI result that never comes. PRs 826 and 835 each sat about
# eleven hours that way.
#
# This runs when `main` moves, which is what usually causes a conflict, and hourly as a
# backstop. `scripts/review/conflict_notice.py` makes the decisions and is unit tested: one
# comment per head commit on each conflicted pull request (the comment is a pull
# request event, so it wakes the watching session), and the `review` label taken off
# so that adding it again after the merge raises an event. Its docstring says when the
# label is left alone. `dev-docs/review-loop.md` is the prose version.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

# A newer push to main makes an older scan's answers stale, so let it replace it.
concurrency:
  group: conflict-notice
  cancel-in-progress: true

jobs:
  notice:
    name: Flag conflicted pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      # `main`'s copy of the script, never a pull request's: every trigger here runs on
      # the default branch.
      - uses: actions/checkout@v4

      - name: Flag conflicted pull requests
        run: |
          # GitHub recomputes mergeability in the background after the base moves.
          if [ "${{ github.event_name }}" = push ]; then sleep 30; fi
          python3 scripts/review/conflict_notice.py
