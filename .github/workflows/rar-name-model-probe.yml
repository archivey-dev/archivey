name: RAR name model probe

# Runs scripts/investigations/exploration/probe_rar_name_model.py and
# probe_rar_oem_dbcs.py: archivey's model of which members an `unrar -n` mask selects,
# compared with RARLAB unrar on Linux (the control), macOS and Windows, and in a
# Windows container whose OEM and ANSI code pages are 932. Results feed
# dev-docs/formats/rar.md. Runs on demand, and on PRs that change the probes or what
# they import or measure.
#
# unrar only: no RARLAB `rar` writer runs here (ADR 0016). The Windows-link fixture
# winlinks_solid__.rar is regenerated by hand with probe_rar_windows_links.py on a
# Windows machine that has WinRAR.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/investigations/exploration/probe_rar_oem_dbcs.py
      - scripts/investigations/exploration/probe_rar_name_model.py
      - .github/workflows/rar-name-model-probe.yml
      # What the probes import or measure.
      - src/archivey/internal/backends/rar_unrar.py
      - tests/test_rar_unrar_names.py
      - tests/test_audit_rar_iso_dir.py
      - tests/fixtures/rar/hostile_argv__rar4.rar

permissions:
  contents: read

jobs:
  names:
    # archivey predicts which members an unrar -n mask selects, to size the skip
    # before a named member. The tests compare that with unrar on Linux only; this runs
    # the comparison with each OS's own model. Linux is the control.
    name: Name model (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archivey and pytest (the archive builders live in the tests)
        run: python -m pip install . pytest
      - name: Install unrar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q unrar
      - name: Install unrar (macOS)
        if: runner.os == 'macOS'
        run: |
          DEST="${RUNNER_TEMP}/rarlab-unrar"
          ./scripts/ci/install-rarlab-unrar.sh --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
      - name: Install unrar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'rarlab-unrar'
          ./scripts/ci/install-rarlab-unrar.ps1 -Dest $dest
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Probe
        run: python scripts/investigations/exploration/probe_rar_name_model.py

  dbcs:
    # Windows unrar reads an 8-bit RAR 1.5-4 name through the OEM code page, and
    # archivey's model of that was measured only under OEM 437. A hosted runner cannot
    # change its own code pages (that needs a reboot), so the probe runs in a Windows
    # container whose image sets OEMCP and ACP to 932, with the runner's Python, the
    # installed package and UnRAR.exe mounted in. The runner itself (437) is the control.
    name: DBCS OEM name model (Windows container, cp932)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install archivey into a directory the container can mount
        shell: pwsh
        run: python -m pip install --target "$env:RUNNER_TEMP\deps" . pytest
      - name: Install unrar
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'rarlab-unrar'
          ./scripts/ci/install-rarlab-unrar.ps1 -Dest $dest
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Control run on the runner (OEM 437)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:RUNNER_TEMP\deps"
          python scripts/investigations/exploration/probe_rar_oem_dbcs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/investigations/exploration/probe_rar_name_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build a cp932 image
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cp932-image'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @'
          FROM mcr.microsoft.com/windows/servercore:ltsc2022
          RUN reg add HKLM\SYSTEM\CurrentControlSet\Control\Nls\CodePage /v OEMCP /t REG_SZ /d 932 /f && reg add HKLM\SYSTEM\CurrentControlSet\Control\Nls\CodePage /v ACP /t REG_SZ /d 932 /f
          '@ | Set-Content -Path (Join-Path $dir 'Dockerfile') -Encoding ascii
          docker build -t archivey-cp932 $dir
      - name: Probe in the cp932 container
        shell: pwsh
        run: |
          $py = Split-Path -Parent '${{ steps.py.outputs.python-path }}'
          docker run --rm `
            -v "${py}:C:\py" `
            -v "$env:RUNNER_TEMP\deps:C:\deps" `
            -v "$env:RUNNER_TEMP\rarlab-unrar:C:\unrar" `
            -v "${env:GITHUB_WORKSPACE}:C:\src" `
            -e PYTHONPATH=C:\deps `
            -e ARCHIVEY_PROBE_CODE_PAGE=932 `
            archivey-cp932 `
            cmd /c "set PATH=C:\unrar;C:\py;%PATH% && python C:\src\scripts\investigations\exploration\probe_rar_oem_dbcs.py && python C:\src\scripts\investigations\exploration\probe_rar_name_model.py"
