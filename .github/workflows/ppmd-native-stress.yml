name: PPMd native stress

# Investigation vehicle for intermittent ``pyppmd`` native aborts on *valid* PPMd
# streams (Windows STATUS_HEAP_CORRUPTION; Linux SIGSEGV / malloc abort after
# other-codec warmup; Linux/Windows exit-after-green abort of
# tests/test_ppmd_raw_streams.py). See dev-docs/known-issues.md and
# dev-docs/investigations/ppmd-native-investigation-results.md §K.
#
# Runs weekly, on demand, and on a pull request that changes the PPMd code, the child
# process around it, its tests, the scripts below, this file, or the dependency pins (a
# pyppmd upgrade); tests/test_ppmd_stress_paths.py keeps that list matching the tree and
# the `run:` steps. There is no post-merge run: the stress marker, the hard raw-streams
# soak and the valgrind gate run nowhere else, so a regression that arrives through a
# pull request outside the list (the 7z reader, streamtools, the decompressor stream)
# waits for the weekly run.
# It lives in its *own* workflow on purpose: do **not** add this check as a required
# status check — a red run here must not block merge. The main CI Windows matrix runs
# the 7z PPMd codec param but skips test_encrypted_ppmd_chunked_reads_roundtrip;
# default pytest excludes ``ppmd_native_stress`` tests. Required CI soft-passes the
# raw-streams exit-after-green abort; this workflow soaks that module hard.
on:
  schedule:
    - cron: "29 5 * * 3"
  pull_request:
    paths:
      - "src/archivey/internal/streams/codecs/ppmd_*.py"
      - "src/archivey/internal/streams/codecs/decoder_child.py"
      - "src/archivey/internal/streams/codecs/decoder_worker.py"
      - "src/archivey/internal/streams/codecs/isolated.py"
      - "src/archivey/internal/streams/child_process.py"
      - "tests/test_ppmd_*.py"
      - "scripts/ppmd_*.py"
      - "scripts/ci_run_native_modules.py"
      - ".github/workflows/ppmd-native-stress.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Isolated child iterations per scenario"
        required: false
        default: "20"

concurrency:
  group: ppmd-native-stress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ppmd-stress:
    name: ${{ matrix.os }} / py${{ matrix.python-version }} / PPMd stress
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: fresh PPMd-only children reproduce STATUS_HEAP_CORRUPTION.
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.14" }
          # Linux: warmup_codecs is highly flaky (~1/3); raw_* stays clean so far.
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.14" }
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      ARCHIVEY_PPMD_STRESS_ITERS: ${{ github.event.inputs.iterations || '20' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        id: setup-uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Authenticated GitHub API — without this, parallel matrix legs can hit the
          # unauthenticated IP rate limit and leave `uv` missing for later steps.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync (dev + all extras)
        id: sync
        run: uv sync --python ${{ matrix.python-version }} --group dev --extra all

      - name: Assert synced venv Python matches matrix
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync python -c
          "import sys; exp=tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          got=sys.version_info[:2]; assert got==exp, (got, exp); print(sys.version)"

      - name: Stress PPMd (script — minimal surface + baseline + warmup)
        # Non-zero exit when any child crashes — intentional for visibility.
        # This workflow must stay non-required so a red run does not block merge.
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          python scripts/ppmd_native_stress.py
          --summary ppmd-stress-summary-${{ matrix.os }}-py${{ matrix.python-version }}.md

      - name: Soak test_ppmd_raw_streams (pytest module exit abort)
        # Distinct fingerprint from warmup_codecs: full pytest module goes green
        # (sessionfinish exit=0) then SIGSEGV/SIGABRT on process exit. Required CI
        # soft-passes that abort; this non-required soak keeps the signal visible.
        # Hard-fails the step on any child crash (no --allow-exit-after-green).
        if: steps.sync.outcome == 'success'
        env:
          ARCHIVEY_PPMD_RAW_STREAMS_ITERS: ${{ github.event.inputs.iterations || '20' }}
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          python scripts/ci_run_native_modules.py
          --modules tests/test_ppmd_raw_streams.py
          --repeat ${{ env.ARCHIVEY_PPMD_RAW_STREAMS_ITERS }}
          --summary ppmd-raw-streams-soak-${{ matrix.os }}-py${{ matrix.python-version }}.md

      - name: Install valgrind (Linux)
        if: runner.os == 'Linux' && steps.sync.outcome == 'success'
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Deterministic UAF gate (valgrind, Linux)
        # Pins the output-buffer use-after-free (ThreadDecoder.c:134) deterministically.
        # The archivey scenarios MUST be clean (a regression here is an archivey bug and
        # fails the step); the bare-pyppmd overshoot reproducer is a detector run without
        # --strict-pyppmd, so its expected-red on 1.3.x does not fail the step. Still
        # non-required overall. See dev-docs/investigations/ppmd-native-investigation-results.md §J.
        if: runner.os == 'Linux' && steps.sync.outcome == 'success'
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          python scripts/ppmd_uaf_valgrind.py --scenario all

      - name: Stress PPMd (pytest marker entry points)
        # Run even when the script step failed (crash signal), but not when setup/sync
        # never installed `uv` (avoids a misleading "uv: command not found").
        if: steps.sync.outcome == 'success'
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          pytest -m ppmd_native_stress -q --timeout=600 -o addopts=

      - name: Upload stress summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppmd-stress-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ppmd-stress-summary-${{ matrix.os }}-py${{ matrix.python-version }}.md
            ppmd-raw-streams-soak-${{ matrix.os }}-py${{ matrix.python-version }}.md
          if-no-files-found: ignore
