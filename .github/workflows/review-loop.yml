name: Review loop

# Adding the `review` label to a pull request runs one review round, and the round takes
# the label off as it starts. That is the whole trigger.
#
# A round is a Claude session that did not write the diff reading it from zero with the
# repo's own `code-review-skill`, posting its findings, and writing a verdict. The
# verdict decides what the closing comment asks for: when the reviewer wants to see the
# fixes, the implementer pushes them and adds the label again; otherwise nobody does.
#
# Who adds the label is the implementing agent when its pull request is ready and again
# after each round of fixes (`address-review-findings`), or a person at any time. Only
# someone with triage access can label a pull request, so the label is also the
# permission check. The gate refuses an agent's label past `MAX_ROUNDS` and at a commit
# a review already failed on; a person's label still runs, up to `MAX_FORCED_ROUNDS`.
# `is_person` in the gate says how the two are told apart.
#
# A finished round also leaves an outcome label (`approved`, `approved-with-fixes`,
# `changes-requested`, `needs-decision`) so the pull request list shows where each one
# stands. Those labels only report; the gate never reads them.
#
# The first lines of this workflow's closing comments are the only state: which rounds
# ran, with what verdict, and where a review failed. Nothing runs without a fresh label.
#
# The reviewer is Opus for the first round of a standard or deep pull request, and
# Sonnet for every other round (`OPUS_PASS_TIERS` in the gate says why).
#
# `scripts/review_loop_gate.py` makes the decisions and writes the closing comment, and
# is unit tested. `dev-docs/review-loop.md` is the prose version.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# Never cancel a review in flight: a half-posted review leaves inline threads with no
# body to read them against. A request made during a round queues behind it. The label
# is in the group because GitHub keeps one pending run per group and cancels the older:
# without it, adding any other label during a round would cancel a queued review.
concurrency:
  group: review-loop-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  loop:
    name: Review round
    # Screened here so that every other label, and a fork, costs no runner. A fork's
    # `pull_request` run has no secrets and a read-only token, so it could neither
    # review nor take the label off.
    if: >-
      github.event.label.name == 'review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tier decides which model reads the round (`OPUS_PASS_TIERS` in the gate).
      # The base branch's copy of the script, as `risk-label.yml` uses, so the path
      # lists the pull request edits do not move its own tier (the gate and the prompt
      # are still the pull request's: see review-loop.md, Known rough edges). Written
      # beside the pull request's copy, since it finds the repository from its own
      # path, and removed again at once. A failure here only makes the round Sonnet's
      # (an empty tier), never stops it.
      - name: Find the risk tier
        id: tier
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git show "origin/$BASE:scripts/review_prep.py" > scripts/.review_prep_base.py
          tier="$(python3 scripts/.review_prep_base.py --base "origin/$BASE" tier \
            | sed -n 's/^tier: //p')"
          rm scripts/.review_prep_base.py
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Tier: $tier" >> "$GITHUB_STEP_SUMMARY"

      - name: Decide whether to run
        id: gate
        env:
          SENDER_TYPE: ${{ github.event.sender.type }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          # Labelling bumps it, so it dates the label this run is for.
          LABEL_SINCE: ${{ github.event.pull_request.updated_at }}
          # The branch head when the label went on. The checkout above is this commit
          # merged with the base, so its tree is this head's changes. A push after the
          # label moves the live head but not this; the round records this one, and
          # its closing comment names any later commits.
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          set -euo pipefail
          # Read now, not from the event: the label may have come off since the event
          # fired.
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels > /tmp/pr.json

          # The first line of each of this workflow's own closing comments: the rounds
          # that ran, their verdicts, and the commits a review failed on. One line per
          # comment, gathered afterwards, because `--jq` runs once per page.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | .body | select(startswith("<!-- archivey-review-"))
                      | split("\n")[0]' > /tmp/markers.txt

          # Which app, if any, added the label. An agent acting through the
          # maintainer's account arrives as a `User` sender, and this is the field that
          # tells it apart (`is_person` in the gate). The events API can lag the
          # webhook, so fetch again for a while until an event as recent as this
          # label is listed; the 30 is the gate's `LABEL_EVENT_SKEW`. Found or not,
          # the gate picks the event, and one it cannot find counts as an agent.
          for attempt in 1 2 3 4; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/events" --paginate \
              --jq '.[] | select(.event == "labeled" and .label.name == "review")
                        | {at: .created_at, actor: .actor.login,
                           app: (.performed_via_github_app.slug // "")}' \
              > /tmp/label-events.jsonl
            if jq -e -s --arg since "$LABEL_SINCE" \
                'any(.[]; (.at | fromdateiso8601) >= ($since | fromdateiso8601) - 30)' \
                /tmp/label-events.jsonl > /dev/null; then
              break
            fi
            [ "$attempt" = 4 ] || sleep 5
          done

          jq -n \
            --slurpfile pr /tmp/pr.json \
            --rawfile markers /tmp/markers.txt \
            --arg sender_type "$SENDER_TYPE" \
            --arg sender_login "$SENDER_LOGIN" \
            --arg label_since "$LABEL_SINCE" \
            --slurpfile label_events /tmp/label-events.jsonl \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$REVIEWED_SHA" \
            --arg tier "$TIER" \
            '{labels: [$pr[0].labels[].name], head_sha: $head_sha,
              markers: ($markers | split("\n") | map(select(length > 0))),
              sender_type: $sender_type, sender_login: $sender_login,
              label_since: $label_since, label_events: $label_events,
              repository: $repository, tier: $tier}' > /tmp/gate-input.json

          python3 scripts/review_loop_gate.py < /tmp/gate-input.json > /tmp/gate.json
          cat /tmp/gate.json
          {
            echo "run=$(jq -r .run /tmp/gate.json)"
            echo "round=$(jq -r .round /tmp/gate.json)"
            echo "final=$(jq -r .final /tmp/gate.json)"
            echo "max_rounds=$(jq -r .max_rounds /tmp/gate.json)"
            echo "opus_pass=$(jq -r '.opus_pass // false' /tmp/gate.json)"
            echo "head_sha=$REVIEWED_SHA"
          } >> "$GITHUB_OUTPUT"
          jq -r '"Gate: run=\(.run) round=\(.round) — \(.reason)"' /tmp/gate.json \
            >> "$GITHUB_STEP_SUMMARY"

      # As soon as the gate has answered, and whatever it answered, so the label is free
      # to be added again: adding a label that is already there raises no event, so one
      # left on would make the next request silently do nothing. Taking it off at the
      # start rather than the end means a request made while this round runs is a new
      # round queued behind it, not one this round then deletes.
      - name: Take the label off
        if: always()
        run: |
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/review" --silent || true

      # Without this, a gate that failed would leave a pull request whose label came
      # off with nothing on it saying why, and an agent waiting on a closing comment
      # does not read the Actions tab.
      - name: Say the round did not start
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "**The review round did not start.** The workflow failed before deciding whether to run, and nothing was counted. Add the \`review\` label again to retry."

      - name: Say why no round runs
        if: steps.gate.outputs.run == 'false'
        run: |
          set -euo pipefail
          # `-j`, not `-r`: an empty comment must leave an empty file, and `-r` would
          # write a newline that `-s` counts, then post a blank body and fail the job.
          jq -j '.comment // ""' /tmp/gate.json > /tmp/comment.md
          if [ -s /tmp/comment.md ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          fi

      # The project installed as `scripts/setup-dev-env.sh` installs it, at the pull
      # request's own lockfile, so the reviewer can run the code it reads: the optional
      # accelerators and codecs a change is about, not only the standard library. The
      # review-eval runs on 2026-10-29 found reviews of rapidgzip changes reporting
      # "rapidgzip is not installed" and reading the code instead of measuring it.
      # A deep pull request's Opus round also asks Cursor for a first look, so the
      # two reviews run side by side. Cursor ignores comments from bots and GitHub
      # Apps, `github-actions[bot]` included, so this one is posted with a person's
      # token, scoped to pull request comments on this repository. Only this step gets
      # it, and it reads no pull request text. Best-effort: no token, no request.
      - name: Ask Cursor for a full review
        continue-on-error: true
        if: >-
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.opus_pass == 'true' &&
          steps.tier.outputs.tier == 'deep'
        env:
          GH_TOKEN: ${{ secrets.CURSOR_TRIGGER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No CURSOR_TRIGGER_TOKEN secret; Cursor is not asked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@cursoragent please do a full code review of this pull request with this repository's \`code-review-skill\`: the whole diff against its base, as a first look. Post the findings as review comments; do not push.

          ---
          _Posted by the review workflow for the Opus round._"

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install the project
        if: steps.gate.outputs.run == 'true'
        run: |
          uv python install 3.11
          uv sync --frozen --group dev --extra all
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Write the prompt
        id: prompt
        if: steps.gate.outputs.run == 'true'
        env:
          ROUND: ${{ steps.gate.outputs.round }}
          MAX_ROUNDS: ${{ steps.gate.outputs.max_rounds }}
          # The pull request's Opus round.
          PASS: ${{ steps.gate.outputs.opus_pass == 'true' && 'opus' || '' }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: python3 scripts/review_loop_prompt.py >> "$GITHUB_OUTPUT"

      # The review has its own timeout inside the job's, so a slow one leaves the close
      # its time.
      - name: Claude review
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 45
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses a bot-initiated run unless the bot is named here, and an
          # agent adds the label as a bot. Named rather than `*`, so an unexpected bot
          # cannot spend review credits. The action reports the actor with and without
          # the `[bot]` suffix depending on the code path, so both spellings are listed.
          allowed_bots: "claude,claude[bot],cursor,cursor[bot]"
          # Opus for a standard or deep pull request's first round, which finds most
          # of what matters; Sonnet, at about an eighth of the cost, for a light pull
          # request and for every round that re-reads fixes (`OPUS_PASS_TIERS`).
          # `Task` (`Agent` in newer CLIs) lets the reviewer start subagents. They get
          # this same allowlist and environment, so narrowing `Bash` here narrows them too.
          claude_args: |
            --model ${{ steps.gate.outputs.opus_pass == 'true' && 'claude-opus-5' || 'claude-sonnet-5-5' }}
            --allowedTools Read,Grep,Glob,WebFetch,Bash,Task,Agent
          prompt: ${{ steps.prompt.outputs.prompt }}

      # `always()` so that a review that died still says so, rather than leaving a pull
      # request whose label came off with nothing on it saying why.
      - name: Close the round
        if: always() && steps.gate.outputs.run == 'true'
        env:
          ROUND: ${{ steps.gate.outputs.round }}
          FINAL: ${{ steps.gate.outputs.final }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          PASS: ${{ steps.gate.outputs.opus_pass == 'true' && 'opus' || '' }}
        run: bash scripts/review_loop_close.sh
