name: Python distributions

# The library on Pythons that other people built, daily and on a dispatch. The legs in
# ci.yml use uv's managed Pythons (python-build-standalone), which bundle recent
# liblzma, zlib, bzip2 and OpenSSL. Most users run a Python that links something else,
# and archivey's stdlib codecs behave like the library underneath them: the python.org
# builds bundle liblzma 5.2.3, which refuses an LZMA Alone stream that has both a size
# and an end marker (#1420), and no ci.yml leg could see that. Each leg here is one such
# distribution, chosen for the libraries it links, not for its Python version:
#
# - python.org on macOS (3.11) and Windows (3.14): their own bundled, older libraries.
# - Ubuntu 22.04's python3.11: the distribution's xz 5.2.5 (older than the 5.2.12 fix
#   above), zlib and bzip2.
# - Fedora's python3: zlib is zlib-ng in compatibility mode, a different deflate.
# - conda-forge: its own builds of xz, zlib, bzip2 and OpenSSL.
#
# Every leg installs [all] and the dev group and runs the whole suite. Leg-specific tools
# (unrar, 7z, unar) are not installed, so the tests that need them skip here; ci.yml
# covers them. Not in the merge queue, and on a pull request only when it changes this
# workflow or its script (maintainer, 2026-11-09): a scheduled failure opens an issue
# (scheduled-failure-alert.yml), and the release gates dispatch this workflow, so a
# release waits for it to be green.
on:
  pull_request:
    paths:
      - .github/workflows/python-distributions.yml
      - scripts/ci/print_codec_libraries.py
  schedule:
    # Offset from ci.yml's daily run (7 3) so the two do not start together.
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-distributions-${{ github.event_name == 'schedule' && 'daily' || github.run_id }}
  cancel-in-progress: true

env:
  # uv must use the distribution's interpreter, never download its own.
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never

jobs:
  hosted:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "python.org 3.11 / macOS", os: macos-latest, source: python.org, python: "3.11" }
          - { name: "python.org 3.14 / Windows", os: windows-latest, source: python.org, python: "3.14" }
          - { name: "Ubuntu 22.04 python3.11", os: ubuntu-22.04, source: apt, python: "3.11" }
          - { name: "conda-forge 3.12 / Linux", os: ubuntu-latest, source: conda-forge, python: "3.12" }
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up python.org Python
        id: python-org
        if: matrix.source == 'python.org'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the distribution's Python (apt)
        if: matrix.source == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y "python${{ matrix.python }}" "python${{ matrix.python }}-venv" "python${{ matrix.python }}-dev"

      - name: Set up conda-forge Python
        if: matrix.source == 'conda-forge'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python }}
          channels: conda-forge
          conda-remove-defaults: "true"

      # The interpreter under test, by source: the one setup-python put on PATH, the
      # distribution's /usr/bin binary, or the activated conda environment's.
      - name: Choose the interpreter
        id: python
        env:
          SOURCE: ${{ matrix.source }}
          PYTHON_ORG: ${{ steps.python-org.outputs.python-path }}
          VERSION: ${{ matrix.python }}
        run: |
          case "$SOURCE" in
            python.org) exe="$PYTHON_ORG" ;;
            apt) exe="/usr/bin/python$VERSION" ;;
            conda-forge) exe="$CONDA_PREFIX/bin/python" ;;
          esac
          "$exe" -c "import sys; print(sys.version)"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install all extras + dev group
        run: uv sync --python "${{ steps.python.outputs.exe }}" --group dev --extra all

      - name: Assert the venv is on that interpreter, and print its libraries
        env:
          WANT: ${{ steps.python.outputs.exe }}
        run: |
          want=$("$WANT" -c "import sys; print(sys.base_prefix)")
          got=$(uv run --no-sync python -c "import sys; print(sys.base_prefix)")
          echo "chosen: $want"
          echo "venv:   $got"
          test "$want" = "$got"
          uv run --no-sync python scripts/ci/print_codec_libraries.py

      - name: Run tests
        run: uv run --no-sync pytest tests/ -q -n auto --no-cov

  # Fedora runs in a container: GitHub has no Fedora runner image.
  fedora:
    name: Fedora python3 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:latest
    steps:
      - name: Install python3, git and a compiler
        run: dnf install -y python3 python3-devel gcc gcc-c++ git

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install all extras + dev group
        run: uv sync --python /usr/bin/python3 --group dev --extra all

      - name: Print the interpreter's libraries
        run: |
          cat /etc/os-release | head -n 2
          uv run --no-sync python scripts/ci/print_codec_libraries.py

      # The container runs as root. The tests that depend on file permissions check
      # os.geteuid() and skip under root, as they do in a development container.
      - name: Run tests
        run: uv run --no-sync pytest tests/ -q -n auto --no-cov
