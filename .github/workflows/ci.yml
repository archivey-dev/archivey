name: CI

# Run on PRs (covers every branch that has one) and in the merge queue. There is no
# `push` trigger: every commit on main arrives through the queue, whose run tested that
# same commit, so a run after the merge only repeated it (about 23 jobs per merge on the
# shared runners; dropped 2026-10-29). Instead a daily scheduled run tests main with
# every job, PyPy's core-only suite included, so a dependency release or a runner image
# change shows up within a day; the README badge shows that run. To get a verdict
# sooner, dispatch this workflow on main.
# `workflow_dispatch` is also the manual escape hatch: with only event triggers, a run
# that never gets created cannot be retried, and there is nothing to click. That is
# not hypothetical — during the 2026-08-06 Actions incident five consecutive events
# (two pushes, two merges to main, one PR open) produced no run at all, leaving main
# and an open PR with no way to get a verdict.
on:
  pull_request:
    # A pull request that changes only documentation does not start this workflow; the
    # docs build and OpenSpec checks live in docs-checks.yml so they still run. A
    # workflow-level filter costs nothing, where a classifier job would hold every code
    # run in the runner queue until it finished. `**` first, then the documentation
    # globs with `!`, then the two doc paths that tests read, re-included (later
    # patterns win): docs/api.md (test_public_api) and review/problem-catalogue/
    # (test_review_problem_catalogue). Add a path there when a test starts reading
    # another doc file. tests/test_ci_doc_paths.py checks that the re-includes come
    # after every `!` entry, and that atheris-fuzz.yml (called in the merge queue) has
    # no pull_request trigger of its own.
    # Two cases skip this workflow although code changed, both from GitHub's filter: a
    # rename is seen under its new name only, so moving code into docs/ alone skips it;
    # and a diff over 3,000 files whose matches fall past the first 3,000 skips it too.
    # Branch protection on main requires no status checks today. If that changes, a
    # required check must come from a workflow that always runs: a docs-only PR gets no
    # check from this one at all, and would wait on it forever.
    paths:
      - "**"
      # Dotfiles listed explicitly in case `**` skips them: .github/ and
      # .pre-commit-config.yaml changes must run the tests.
      - ".*"
      - ".*/**"
      - "!**.md"
      - "!docs/**"
      - "!docs_templates/**"
      - "!mkdocs.yml"
      - "!LICENSE"
      - docs/api.md
      - review/problem-catalogue/**
  # The merge queue. Path filters do not apply to merge_group, so every queued group runs
  # the whole workflow, and the `CI gate` job below is the check the ruleset requires.
  merge_group:
  # Daily full run on main (the default branch; GitHub runs schedules there only).
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

# A pull request push runs a reduced set of jobs; the merge queue, the daily run and a
# dispatched run get all of them. Every job below runs on pull requests unless it says
# otherwise. On a pull request: lint, the `test` legs (Linux 3.11 and 3.14 [all], Linux
# 3.11 core-only, Windows 3.14 [all]), free-threaded 3.13t, the structural benchmark and
# the three plugin jobs. Only past it: the `test-queue` legs (the other Pythons, 3.14
# core-only, the minimum versions, macOS, Windows 3.11), 3.15t, the distribution unar
# packages, PyPy and the short Atheris fuzz. A failure there takes the pull request out
# of the queue. The split exists because the organization's runners are shared (20 jobs
# at once, 5 of them macOS): full runs on every push kept the queue's runs waiting for a
# runner until they timed out (2026-10-29). Dispatch this workflow on a branch to run
# everything before queueing. Pull request runs read the Actions caches saved on main,
# which only the daily run saves now, so after a `uv.lock` change they may install cold
# until the next daily run (or a dispatch on main).
#
# Cancel an in-progress run when a newer commit arrives for the same PR/branch, so
# rapid pushes don't pile up redundant full-matrix runs. Outside pull requests the event
# is in the group too, so a dispatch on main never cancels the daily run the badge shows.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true

jobs:
  # Lint + type-check once (these are environment-independent). No continue-on-error:
  # a failure here fails CI — the "clean on Pyrefly AND ty" gate is enforced.
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync (dev tooling + all extras)
        # Type checkers need optional deps importable (tqdm, pycdlib, …) so they can
        # validate real types rather than suppress missing-import. `--extra all` matches
        # the everyday recommended install; core-only is covered by the test matrix.
        run: uv sync --group dev --extra all
      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/ benchmarks/ packages/archivey-squashfs/ packages/archivey-cpio/ packages/archivey-ar/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/ scripts/ benchmarks/ packages/archivey-squashfs/ packages/archivey-cpio/ packages/archivey-ar/
      - name: Pyrefly
        run: uv run pyrefly check
      - name: ty
        run: uv run ty check

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.install }}
    runs-on: ${{ matrix.os }}
    # Backstop for a hang outside a test (install/sync). A hung *test* fails much sooner via
    # pytest's per-test --timeout; this just bounds the whole job so it can't run for hours.
    timeout-minutes: 20
    # The full-suite pytest steps below run on all cores (`-n auto`, pytest-xdist): 4 vCPUs
    # on Linux and Windows, 3 on macOS. Measured 2026-10-02 on 4 cores, 3.11: 13m15s serial
    # with coverage, 1m52s with -n 4 and --no-cov, same results. The distro-unar probe and
    # the scripts/ci_run_native_modules.py steps are one process by design.
    # Force every uv sync/run in this job onto the matrix interpreter. Without this,
    # `.python-version` (3.11) wins and "py3.12/3.13/3.14" legs silently re-test 3.11.
    # The legs split into two jobs, `test` here (every run) and `test-queue` (not on pull
    # requests), which share these steps through the YAML anchors `test-env` and
    # `test-steps`. Check names stay `os / pyX / install` in both.
    env: &test-env
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Min and max Python on Linux [all], one core-only leg, and Windows on the max
          # Python because it differs most from Linux. The rest are in `test-queue`.
          - { os: ubuntu-latest, python-version: "3.11", install: core-only }
          - { os: ubuntu-latest, python-version: "3.11", install: all }
          # The one leg that measures coverage. Nothing reads the result (there is no
          # upload and no threshold, see CONTRIBUTING.md), and tracing doubled the run on
          # 3.11 (measured 2026-10-02), where coverage uses the C tracer: every other leg
          # passes --no-cov. 3.14 is the cheapest place for it, since coverage uses
          # sys.monitoring there. The steps pass --cov-report=term-missing here, which
          # addopts already sets, only because an empty string is false in a GitHub
          # expression: `matrix.coverage && '' || '--no-cov'` would give --no-cov here too.
          - { os: ubuntu-latest, python-version: "3.14", install: all, coverage: true }
          - { os: windows-latest, python-version: "3.14", install: all }

    steps: &test-steps
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # The encrypted-ZIP corpus rows shell out to ``7z`` to build their fixtures
      # (stdlib ``zipfile`` cannot write encryption). Without this the rows skip, and
      # before this step nothing installed it — so whether they ran depended on the
      # runner image and could vanish on an image bump with no test turning red.
      # Linux only, deliberately: the rows exercise ZipCrypto *reading* (pure Python)
      # over flat files, so they engage none of the path/symlink surface the macOS and
      # Windows legs exist for. See the T7 audit, residual 1, in
      # ``review/archive/2026-07-28-debt-ledger/corpus-matrix.md``.
      # ``tests/test_sevenzip_bcj2.py`` uses ``7z`` as its oracle for BCJ2 folders, which
      # read on a core install; the ``core-only`` legs get it too, so the claim is
      # exercised on the leg where it is made rather than skipped there. Both steps run
      # before the first test step, core-only included, so no test runs without ``7z``.
      # ``p7zip-full`` is transitional on Ubuntu 24.04 (-> ``7zip``) but still provides
      # ``/usr/bin/7z``, which is the name the builder invokes.
      - name: Install p7zip (encrypted-ZIP corpus builder and BCJ2 oracle, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Verify 7z on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v 7z
          # Fail loudly if the package ever stops providing the ``7z`` name: a silent
          # skip is exactly the unpinned-coverage failure this step exists to remove.
          7z i | head -n 3
          # The ARM64 oracle tests (tests/test_sevenzip_arm64.py) skip on a 7z that
          # cannot write the filter (p7zip 16.02); 7-Zip 23+ lists it. Pin that here.
          7z i | grep -qw ARM64

      # ---- core-only: install the package with NO extras and NO dev group, then prove
      # the zero-dep core works and that no third-party runtime package is present.
      - name: Install core only (no extras, no dev group)
        if: matrix.install == 'core-only'
        run: uv sync --python ${{ matrix.python-version }} --no-dev

      - name: Assert zero-dependency core
        if: matrix.install == 'core-only'
        run: uv run --python ${{ matrix.python-version }} --no-sync python tests/check_zero_dep_core.py

      # Run the full suite against the zero-dep core too. pytest (+pytest-cov) is
      # layered in ephemerally with --with so the optional FORMAT libraries stay
      # absent; tests that need an optional lib must skip/xfail cleanly (see the
      # `requires` helper in tests/conftest.py), which is exactly what this leg proves.
      - name: Run tests (core-only)
        if: matrix.install == 'core-only'
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          --with pytest --with pytest-cov --with pytest-timeout --with pytest-xdist
          pytest tests/ -q -n auto --no-cov

      # ---- [all]: full extras + dev group; run the whole suite.
      - name: Install all extras + dev group
        if: matrix.install == 'all'
        run: uv sync --python ${{ matrix.python-version }} --group dev --extra all

      # ---- [all-lowest]: same extras, but every declared dependency pinned to its minimum
      # allowed version (--resolution lowest-direct), so the suite runs against the floor of
      # the supported range. Resolves fresh rather than from uv.lock (which pins current
      # versions); the shared test step below uses --no-sync so this resolution stands.
      - name: Install all extras + dev group (minimum versions)
        if: matrix.install == 'all-lowest'
        run: >
          uv sync --python ${{ matrix.python-version }}
          --group dev --extra all --resolution lowest-direct

      # RAR *data* tests (and the structural gate's rar_* cases) need RARLAB unrar.
      # Listing works without it; with CI=true the gate fail-closes if data cases omit.
      #
      # Install *unrar only* — never the RARLAB `rar` writer, on any leg. The corpus's
      # declarative RAR cases used to need it and so ran nowhere; their archives are now
      # committed under tests/fixtures/corpus/rar/ and pinned to the entry definitions
      # by a manifest (scripts/gen_corpus_rar_fixtures.py). That exercises the RAR
      # column on *every* platform rather than only where a trialware writer happens to
      # be installed, and keeps CI free of a licensing decision. See ADR 0016.
      #
      # The sweep's earlier failures were never platform-dependence: the corpus makes no
      # platform-dependent assertion about a RAR member (mode/uid/mtime are asserted
      # only for tar, digest *values* never). Two assertion arms in the test were wrong.
      # See dev-docs/investigations/rar-corpus-sweep-diagnosis.md.
      #
      # unar (The Unarchiver's XADMaster) is the second RAR data program: the default
      # rar_decompressor="auto" uses it when no RARLAB program is installed, and
      # rar_decompressor="unar" selects it. tests/test_rar_unar.py compares it
      # with unrar on every committed fixture and skips without it. macOS gets the
      # Homebrew bottle (XADMaster 1.10.8), which is the build macOS users install.
      # Windows has no packaged unar.
      #
      # Linux: Ubuntu's package is installed, but archivey refuses it. Debian and Ubuntu
      # unar packages before 1.10.8+ds1-10 carry CSInputBuffer-bit-string-reading.patch,
      # which makes unar write nothing, with exit 0, for about one compressed RAR5 member
      # in 25. find_unar runs every unar once on a small archive with such a member and
      # does not use one that drops it (dev-docs/known-issues.md, "Debian/Ubuntu unar
      # 1.10.1"). So the Linux legs build upstream XADMaster 1.10.8 from source and put
      # it first on PATH, and a separate step below EXPECTS Ubuntu's /usr/bin/unar to
      # fail the check. The apt package stays installed for that step and for the
      # shared libraries the source build links against.
      # xorriso builds the hybrid ISOs tests/test_iso_trailing_data.py checks.
      # tabix ships bgzip, the reference BGZF writer tests/test_bgzf_seek.py checks
      # the block walk against.
      - name: Install unrar, unar, xorriso and bgzip (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unrar unar xorriso tabix
      # The built binary links against the image's libgnustep-base and libicu, whose
      # sonames change between Ubuntu releases, so the key names the image as well as
      # the pinned sources (the script's hash).
      - name: Name the image for the unar build cache (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        id: unar-image
        run: echo "image=$(. /etc/os-release && echo "${ID}${VERSION_ID}")" >> "$GITHUB_OUTPUT"
      - name: Cache unar 1.10.8 built from source (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        id: unar-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/unar-1.10.8
          key: unar-xadmaster-v1.10.8-ud1.1-${{ hashFiles('scripts/install-unar-from-source.sh') }}-${{ steps.unar-image.outputs.image }}-${{ runner.arch }}
      # Installed on a cache hit too: the script rebuilds over a cached binary that does
      # not print its banner (a cache saved after a failed step), and that needs these.
      - name: Install unar build dependencies (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        run: >
          sudo apt-get install -y gnustep-make libgnustep-base-dev gobjc
          libbz2-dev zlib1g-dev libicu-dev libwavpack-dev
      - name: Build unar 1.10.8 and put it first on PATH (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        run: |
          DEST="${RUNNER_TEMP}/unar-1.10.8"
          ./scripts/install-unar-from-source.sh --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
      # 7-Zip 26.05: the runner's 7z predates the RISC-V filter (7-Zip 24), which
      # tests/test_sevenzip_riscv.py writes with a live 7-Zip as its oracle; without one
      # those checks skip. Built from the pinned ip7z/7zip commit; the binary links
      # against the image's libstdc++, so the key names the image too. The script
      # refuses a binary whose `7zz i` does not list RISCV, cached or not.
      - name: Cache 7-Zip 26.05 built from source (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/7zip-26.05
          key: 7zip-26.05-${{ hashFiles('scripts/install-7zip-from-source.sh') }}-${{ steps.unar-image.outputs.image }}-${{ runner.arch }}
      - name: Build 7-Zip 26.05 and put 7zz on PATH (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        run: |
          DEST="${RUNNER_TEMP}/7zip-26.05"
          ./scripts/install-7zip-from-source.sh --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
      # Homebrew disabled the `rar` cask on 2026-09-01 (official binaries fail
      # Gatekeeper notarization). Compile RARLAB UnRAR from a pinned git commit
      # of the pmachapman/unrar GitHub mirror (not rarlab, not GitHub's generated
      # archive tarball). The GHA cache stores the *built binary*; the commit pin
      # is checked when the script actually builds, not on a cache hit. `unar` does
      # not satisfy the unrar finder, which requires the RARLAB banner; it is only
      # used when a caller selects it.
      - name: Cache compiled RARLAB unrar (macOS)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rarlab-unrar
          key: rarlab-unrar-${{ hashFiles('scripts/install-rarlab-unrar.sh') }}-${{ runner.os }}-${{ runner.arch }}
          save-always: true
      - name: Install unrar (macOS)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'macOS'
        run: |
          DEST="${RUNNER_TEMP}/rarlab-unrar"
          ./scripts/install-rarlab-unrar.sh --dest "$DEST"
          echo "$DEST" >> "$GITHUB_PATH"
          test -x "$DEST/unrar"
          command -v rar && exit 1 || true
      - name: Install unar (macOS)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'macOS'
        run: |
          brew install unar
          unar -h | head -n 1
      # rarlab.com refused the connection often enough to redden Windows runs on
      # its own (run 34392160804: "connection attempt failed because the
      # connected party did not properly respond"). Same shape as the macOS leg:
      # the cache holds the *installed binary* so the common case makes no
      # request at all, and the installer retries when it does.
      #
      # The installer pins a WinRAR release by version and digest, so the key is
      # the installer's hash alone: editing the pin refreshes the cache, and
      # nothing else should.
      - name: Cache RARLAB unrar (Windows)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rarlab-unrar
          # Do NOT add restore-keys here. A prefix fallback would restore the
          # previous pin's binary on the run that moves the pin, the installer
          # would find a valid UnRAR.exe and accept it, and CI would go on
          # testing the old version.
          key: rarlab-unrar-${{ hashFiles('scripts/install-rarlab-unrar.ps1') }}-${{ runner.os }}-${{ runner.arch }}
          save-always: true
      - name: Install unrar (Windows)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Official x64 UnRAR, unpacked from a pinned WinRAR installer (not
          # chocolatey's x86 package + ShimGen shim — shims
          # have broken solid ``unrar p`` pipes on this matrix). The script no-ops
          # when the cache already restored UnRAR.exe.
          $dest = Join-Path $env:RUNNER_TEMP 'rarlab-unrar'
          ./scripts/install-rarlab-unrar.ps1 -Dest $dest
          # Same belt-and-suspenders as the macOS leg's `test -x`: assert the
          # binary before putting the directory on PATH, so a script that
          # somehow returns 0 without one fails here and not a step later.
          if (-not (Test-Path -LiteralPath (Join-Path $dest 'UnRAR.exe'))) {
            throw "UnRAR.exe missing from $dest after install-rarlab-unrar.ps1"
          }
          # Windows is case-insensitive: shutil.which('unrar') finds UnRAR.exe.
          # Do not copy to unrar.exe — that overwrites the file with itself.
          echo $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify RARLAB unrar on PATH
        if: matrix.install == 'all' || matrix.install == 'all-lowest'
        shell: bash
        run: |
          command -v unrar
          unrar 2>&1 | head -n 3 || true
          # archivey's finder requires the RARLAB banner (not unrar-free / unar / 7z).
          uv run --python ${{ matrix.python-version }} --no-sync python -c \
            "from archivey.internal.backends.rar_unrar import find_rarlab_unrar; print(find_rarlab_unrar())"

      # The unar tests must not skip quietly: fail here if archivey would not use the
      # unar on PATH (the source build on Linux, Homebrew's on macOS).
      - name: Verify archivey uses the unar on PATH (Linux, macOS)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os != 'Windows'
        run: |
          command -v unar
          uv run --python ${{ matrix.python-version }} --no-sync python -c \
            "from archivey.internal.external.unar import find_unar; print(find_unar(purpose='in CI'))"

      # EXPECTED TO FAIL THE CHECK. Ubuntu's unar (24.04: 1.10.7+ds1+really1.10.1)
      # carries Debian's CSInputBuffer-bit-string-reading.patch and drops some
      # compressed RAR5 members; this step asserts that archivey's unar check still
      # catches it. If it starts failing because the check PASSES, Ubuntu's unar now
      # decodes correctly: set ARCHIVEY_DISTRO_UNAR_EXPECT to "clean" here, consider
      # dropping the source build above so Linux tests the distribution's unar again,
      # and update dev-docs/known-issues.md with the package version that fixed it. The
      # test's failure message says the same. The unar-distro-packages job does this
      # for other distributions.
      - name: Expect Ubuntu's unar to fail archivey's RAR5 check (Linux)
        if: (matrix.install == 'all' || matrix.install == 'all-lowest') && runner.os == 'Linux'
        env:
          ARCHIVEY_DISTRO_UNAR: /usr/bin/unar
          ARCHIVEY_DISTRO_UNAR_EXPECT: patched
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          pytest tests/test_unar_probe.py::test_distro_unar_matches_the_ci_expectation
          -q --no-cov -rs

      - name: Assert synced venv Python matches matrix
        # Catch regressions where `.python-version` silently overrides the matrix again.
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync python -c
          "import sys; exp=tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          got=sys.version_info[:2]; assert got==exp, (got, exp); print(sys.version)"

      # Process isolation for intermittent Linux [all] heap corruption (rapidgzip /
      # pyppmd natives). Separate steps — not a multiline script with shell
      # continuations — keep this Windows/PowerShell-safe. Full write-up + soak/A/B:
      # dev-docs/known-issues.md ("Intermittent Linux full-suite heap corruption").
      # --no-sync so the all-lowest leg keeps its minimum-version resolution.
      - name: Run tests
        if: matrix.install == 'all' || matrix.install == 'all-lowest'
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          pytest tests/
          --ignore=tests/test_property_safety.py
          --ignore=tests/test_rapidgzip_deflate_zlib.py
          --ignore=tests/test_accelerator_shutdown.py
          --ignore=tests/test_accelerator_corruption.py
          --ignore=tests/test_ppmd_raw_streams.py
          -q -n auto ${{ matrix.coverage && '--cov-report=term-missing' || '--no-cov' }}

      - name: Run accelerator stream tests
        if: matrix.install == 'all' || matrix.install == 'all-lowest'
        env:
          PYTHONFAULTHANDLER: "1"
        # One fresh subprocess per accelerator module (coverage off, breadcrumbs).
        # PPMd raw streams are intentionally not in this batch — see next step.
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          python scripts/ci_run_native_modules.py

      - name: Run PPMd raw stream tests
        if: matrix.install == 'all' || matrix.install == 'all-lowest'
        env:
          PYTHONFAULTHANDLER: "1"
        # Soft-pass parent-process exit-after-green: the known pyppmd issue can
        # still trip the parent at exit (see known-issues.md).
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          python scripts/ci_run_native_modules.py
          --modules tests/test_ppmd_raw_streams.py
          --allow-exit-after-green

      - name: Run property-safety tests
        if: matrix.install == 'all' || matrix.install == 'all-lowest'
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run --python ${{ matrix.python-version }} --no-sync
          pytest tests/test_property_safety.py -q -n auto
          ${{ matrix.coverage && '--cov-report=term-missing' || '--no-cov' }}

  # The test legs that run only past a pull request: in the merge queue, the daily run
  # and a dispatched run (see the note at the top). Same steps as `test`.
  test-queue:
    name: ${{ matrix.os }} / py${{ matrix.python-version }} / ${{ matrix.install }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Prerelease legs (matrix.prerelease) report but cannot fail the run: a CPython
    # release candidate, or a dependency with no wheel for it yet, is not a regression.
    # A row without the key compares null to true, which GitHub evaluates as false, so
    # every other row still fails the run. (`test` has no prerelease row.)
    continue-on-error: ${{ matrix.prerelease == true }}
    env: *test-env
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zero-dep core on the max Python (`test` has the min; the core path barely
          # varies across point releases, so min/max is enough).
          - { os: ubuntu-latest, python-version: "3.14", install: core-only }
          # Linux [all] on the Pythons between min and max.
          - { os: ubuntu-latest, python-version: "3.12", install: all }
          - { os: ubuntu-latest, python-version: "3.13", install: all }
          # CPython 3.15 prerelease (3.15.0rc3 as of 2026-10-08), allowed to fail. Drop
          # `prerelease` and add the classifier once 3.15.0 final is out.
          - { os: ubuntu-latest, python-version: "3.15", install: all, prerelease: true }
          # Minimum supported library versions (uv --resolution lowest-direct) on the min
          # Python: the [all] legs run the *current* versions of every dependency, so
          # this leg pins each declared dep to its floor (pycdlib 1.22, zstandard 0.23, …) to
          # catch version-specific bugs that the default highest-version resolution hides.
          - { os: ubuntu-latest, python-version: "3.11", install: all-lowest }
          # macOS on min/max Python and Windows on the min (cross-platform
          # path/symlink/junction surface; `test` has Windows on the max).
          - { os: macos-latest, python-version: "3.11", install: all }
          - { os: macos-latest, python-version: "3.14", install: all }
          - { os: windows-latest, python-version: "3.11", install: all }
    # These rows have no `coverage` key: it evaluates to null, so the steps pass
    # --no-cov. actionlint reports the key as undefined here; that is expected.
    steps: *test-steps

  # Each distribution's packaged unar against archivey's unar RAR5 check, and the unar
  # tests against it. Kept apart from the test matrix and cheap: a container per
  # distribution, core install, two test files.
  #
  # Debian and Ubuntu unar packages before 1.10.8+ds1-10 carry Debian's
  # CSInputBuffer-bit-string-reading.patch, which makes unar write nothing, with exit
  # 0, for about one compressed RAR5 member in 25 (dev-docs/known-issues.md,
  # "Debian/Ubuntu unar 1.10.1"). archivey refuses a unar that does this. Each row
  # declares what its package is expected to do: "patched" (the check must fail;
  # the unar tests then skip) or "clean" (it must pass; the unar tests run against
  # it). When a row fails, the distribution changed its package: the test's failure
  # message says what to update. Ubuntu's own package is checked in the test job.
  #
  # Expectations, confirmed by this job's runs on 2026-10-09:
  #   debian:stable  patched  Debian 13 ships 1.10.8+ds1-9, whose patch series has
  #                           the patch; 1.10.8 built with it drops the member.
  #   debian:unstable clean   1.10.8+ds1-10 deleted the patch (changelog and series).
  #   fedora:latest  clean    The patch is Debian's; Fedora ships 1.10.8 without it.
  # Alpine does not package unar (no unar in aports main, community or testing), so
  # it has no row.
  #
  # The images come from mirror.gcr.io, Google's no-auth cache of Docker Hub's
  # official images, not from Docker Hub. Docker Hub pulls failed before the job
  # started: toomanyrequests (anonymous pulls are limited per IP address and GitHub's
  # runners share addresses) and auth.docker.io timeouts, both on 2026-10-09. Caching
  # the image ourselves cannot help, because a `container:` job pulls before its
  # first step. AWS's public ECR mirror (public.ecr.aws/docker/library/) is the
  # fallback if this one fails; it has not been tried from a runner. The job
  # prefixes mirror.gcr.io/library/, so a row's `image` must be a Docker Hub
  # official image (a name with no slash); the names stay Docker Hub's so the job
  # names do not change.
  #
  # Not on pull requests: the packages change on the distributions' schedule, not ours.
  unar-distro-packages:
    name: unar package / ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            expect: patched
            install: apt-get update && apt-get install -y --no-install-recommends unar ca-certificates
          - image: debian:unstable
            expect: clean
            install: apt-get update && apt-get install -y --no-install-recommends unar ca-certificates
          - image: fedora:latest
            expect: clean
            install: dnf install -y unar
    steps:
      - uses: actions/checkout@v4
      - name: Install the distribution's unar
        run: ${{ matrix.install }}
      - name: Show the package
        run: |
          command -v unar
          unar -h | head -n 1
          (dpkg-query -W unar || rpm -q unar) 2>/dev/null || true
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install core only
        run: uv sync --python 3.12 --no-dev
      - name: Check the package against its expectation, then run the unar tests
        env:
          ARCHIVEY_DISTRO_UNAR: /usr/bin/unar
          ARCHIVEY_DISTRO_UNAR_EXPECT: ${{ matrix.expect }}
        run: >
          uv run --python 3.12 --no-sync
          --with pytest --with pytest-cov --with pytest-timeout
          pytest tests/test_unar_probe.py tests/test_rar_unar.py -q --no-cov -rs

  # Free-threaded correctness. Two stages: the zero-dep core, then the subset of extras
  # that actually keep the GIL disabled. An extra whose C extension has not declared
  # free-thread support makes CPython silently *re-enable* the GIL on import, which would
  # turn this whole job into a GIL-ed run pretending to be a free-threaded one — so the
  # extras stage asserts the GIL is still off before it runs anything.
  # Deliberately excluded from [free-threaded] (measured 2026-07-29, CPython 3.13.7t):
  #   pyppmd / inflate64 / brotli / rapidgzip -> import re-enables the GIL
  #   cryptography -> cffi does not support free-threaded 3.13 at all ("Upgrade to
  #     free-threaded 3.14 or newer"), so it cannot be installed. It IS in the extra
  #     behind a python_version >= '3.14' marker, where it keeps the GIL disabled.
  # Revisit both lists on 3.14t. See docs/install.md.
  #
  # 3.15t is the 3.15 prerelease, allowed to fail like the 3.15 test leg. No lz4 wheel
  # for it yet (2026-10-08), so lz4 builds from source; cryptography ships cp315 abi3t
  # wheels since 50.0 and keeps the GIL disabled there, as on 3.14t. 3.15t does not run
  # on pull requests; 3.13t does.
  free-threaded-concurrency:
    name: free-threaded-concurrency / py${{ matrix.python }} / core + GIL-safe extras
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # As in the `test-queue` job: a row without `prerelease` (3.13t) can fail the run.
    continue-on-error: ${{ matrix.prerelease == true }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"python": "3.13t"}]'
          || '[{"python": "3.13t"}, {"python": "3.15t", "prerelease": true}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install free-threaded CPython ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Sync zero-dep core
        run: uv sync --python ${{ matrix.python }} --no-dev
      - name: Assert zero-dependency core
        run: uv run --python ${{ matrix.python }} --no-sync python tests/check_zero_dep_core.py
      # The whole suite, not just the concurrent_reader subset: single-threaded
      # free-threaded breakage (dict/list races in shared state, C-API assumptions) shows
      # up here, and the marked subset is only ~46 of ~2000 tests.
      # Override addopts so we do not need pytest-cov in the core-only ephemeral env. That
      # also drops the shared --timeout, hence the explicit one here; 120s rather than 60
      # because free-threaded runs are slower. The thread timeout method is NOT repeated:
      # it is an ini option in pyproject.toml, which `-o addopts=` does not touch. This
      # job hung outright four times on 2026-09-21 with the timeout armed and never
      # fired, which is why that method is set at all.
      # `-n auto` as in the other legs: run single-process, this job was the slowest in
      # the workflow (two full suites, about 15 minutes).
      - name: Run full suite (core-only)
        run: >
          uv run --python ${{ matrix.python }} --no-sync
          --with pytest --with pytest-timeout --with pytest-xdist
          pytest tests/ -q -n auto --timeout=120 -o addopts=

      - name: Sync GIL-safe extras
        # [free-threaded] IS this list, so the job now installs the documented extra
        # rather than a hand-maintained copy of it that could drift from the packaging.
        run: uv sync --python ${{ matrix.python }} --no-dev --extra free-threaded
      - name: Assert the GIL is still disabled with those extras
        # Fail loudly if a future release of one of these starts re-enabling the GIL:
        # the job would otherwise keep passing while testing nothing free-threaded.
        # The script reads the package list from the installed archivey's [free-threaded]
        # metadata, so it follows the extra and its per-interpreter markers by itself.
        run: uv run --python ${{ matrix.python }} --no-sync python tests/check_free_threaded_gil.py
      - name: Run full suite + concurrent_reader (GIL-safe extras)
        run: >
          uv run --python ${{ matrix.python }} --no-sync
          --with pytest --with pytest-timeout --with pytest-xdist
          pytest tests/ -q -n auto --timeout=120 -o addopts=
      - name: Assert the GIL-re-enabling packages stay unimported
        # pyppmd, inflate64, brotli and rapidgzip re-enable the GIL when imported, so
        # archivey imports each one only when a stream needs it. With all four installed,
        # a fresh interpreter that imports archivey and lists formats must still have the
        # GIL off. The env var makes the test fail rather than skip if they are missing.
        # Last, and through --with, so the suite above never runs with them installed.
        env:
          ARCHIVEY_EXPECT_GIL_REENABLING_PACKAGES: "1"
        run: >
          uv run --python ${{ matrix.python }} --no-sync
          --with pytest --with pyppmd --with inflate64 --with brotli --with rapidgzip
          pytest tests/test_lazy_optional_imports.py -q -o addopts=

  # PyPy. It is still not a supported interpreter (docs/install.md §PyPy), but the whole
  # suite has to pass there, once with the zero-dependency core and once with every
  # optional package that installs, so a PyPy regression fails the run instead of sitting
  # in a log. The check and test steps carry `if: ${{ !cancelled() }}` so a failure in
  # one does not hide the later ones; any failed step still fails the job, and a
  # superseded run stops at once.
  # Dependencies come one at a time rather than through `--extra all`, because several
  # native packages have no PyPy wheel and one failed build would hide what does install;
  # the "Install what installs" step writes the outcome per package to the job summary.
  # The test steps print no tracebacks (--tb=no) and write a JUnit report (xunit1, which
  # keeps each test's file for its node id); the step after each prints one line per
  # failure from it (scripts/junit_failure_lines.py), so the whole result fits in the
  # part of the log the GitHub API returns. Not on pull requests.
  pypy:
    name: ${{ matrix.python }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install ${{ matrix.python }}
        run: |
          uv python install ${{ matrix.python }}
          uv run --python ${{ matrix.python }} --no-project python -VV
      - name: Install 7z, unrar and xorriso
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar xorriso
      - name: Sync zero-dep core
        run: uv sync --python ${{ matrix.python }} --no-dev
      - name: Assert zero-dependency core
        if: ${{ !cancelled() }}
        run: uv run --python ${{ matrix.python }} --no-sync python tests/check_zero_dep_core.py
      # Core-only on PyPy runs on the daily run and on a dispatched run (a release gate,
      # scripts/release.py), not in the merge queue: it is about five of this job's fifteen
      # minutes, and the CPython core-only legs already cover the fallback paths.
      - name: Run full suite (core-only)
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run --python ${{ matrix.python }} --no-sync
          --with pytest --with pytest-timeout --with pytest-xdist
          pytest tests/ -q -n auto --timeout=300 -o addopts= --tb=no -p no:warnings
          -m 'not ppmd_native_stress' --junitxml=pypy-core.xml -o junit_family=xunit1
      - name: Failures (core-only), one line each
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        run: python3 scripts/junit_failure_lines.py pypy-core.xml
      - name: Install what installs (runtime extras, then test-only packages)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ${{ matrix.python }}: optional packages"
            echo
            echo "| package | result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in pyppmd inflate64 brotli lz4 cryptography pycdlib tqdm \
              backports.zstd rapidgzip \
              pytest pytest-timeout pytest-xdist hypothesis py7zr rarfile \
              libarchive-c ncompress urllib3 fsspec pyzstd; do
            if uv pip install --python .venv "$pkg" > "pip-$pkg.log" 2>&1; then
              ver=$(uv pip show --python .venv "$pkg" | sed -n 's/^Version: //p')
              echo "| $pkg | installed $ver |" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "| $pkg | FAILED: $(grep -m1 -iE 'error|failed' "pip-$pkg.log" | cut -c1-150 | tr '|' '/') |" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::group::$pkg install log"; cat "pip-$pkg.log"; echo "::endgroup::"
            fi
          done
      - name: Run full suite (with what installed)
        if: ${{ !cancelled() }}
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run --python ${{ matrix.python }} --no-sync
          pytest tests/ -q -n auto --timeout=300 -o addopts= --tb=no -p no:warnings
          -m 'not ppmd_native_stress' --junitxml=pypy-extras.xml -o junit_family=xunit1
      - name: Failures (with what installed), one line each
        if: ${{ !cancelled() }}
        run: python3 scripts/junit_failure_lines.py pypy-extras.xml

  # Blocking gate = **structural only** (seek baselines + solid decode-once).
  # Wall-time ratios are noisy on shared runners; they run separately, non-blocking,
  # as a change-guarded scheduled job — see `.github/workflows/benchmark-wall.yml`.
  benchmark:
    name: Benchmark gate (structural)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync (dev + all extras)
        run: uv sync --group dev --extra all
      # RAR *data* structural cases (rar_solid_*, rar_encrypted_*) need RARLAB unrar.
      # Listing (rar_open_list) works without it — do not drop this step or T3 silently
      # omits the data-path half of the gate (pytest fail-closes when CI=true).
      - name: Install unrar (RAR data structural cases)
        run: sudo apt-get update && sudo apt-get install -y unrar
      - name: Structural benchmark gate
        run: >
          uv run --no-sync python -m benchmarks.harness
          --mode structural --json-out benchmark-structural.json
      - name: Upload structural results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-structural
          path: benchmark-structural.json
      - name: Pytest structural gate + measurement unit tests
        run: uv run --no-sync pytest tests/test_benchmark_gate.py tests/test_measurement.py -q

  # The SquashFS reader in packages/archivey-squashfs: a format added from outside the
  # library, through the public plugin API only. Its own tests, against images
  # mksquashfs wrote (tests/data/make-images.sh), with lz4 for the LZ4 image and
  # python-lzo for the second LZO decoder.
  squashfs-plugin:
    name: archivey-squashfs plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install liblzo2, which python-lzo builds against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzo2-dev
      - name: Sync, then install the package over it
        # python-lzo too, so the tests check the package's LZO decoder against liblzo2.
        run: |
          uv sync --group dev --extra all
          uv pip install -e packages/archivey-squashfs --no-deps
          uv pip install python-lzo
      - name: Pytest
        run: uv run --no-sync pytest packages/archivey-squashfs/tests -q --no-cov -rs

  # The CPIO reader in packages/archivey-cpio: a format read in one forward pass, added
  # from outside the library through the public plugin API only. Its own tests, against
  # archives GNU cpio and bsdcpio wrote (tests/data/make-archives.sh), from a file and
  # from a pipe.
  cpio-plugin:
    name: archivey-cpio plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync, then install the package over it
        run: |
          uv sync --group dev
          uv pip install -e packages/archivey-cpio --no-deps
      - name: Pytest
        run: uv run --no-sync pytest packages/archivey-cpio/tests -q --no-cov -rs

  # The ar reader in packages/archivey-ar: a second format read in one forward pass, to
  # test the same API from a different shape (a long-name table carried across the walk,
  # names stored in the data area). Its own tests, against archives GNU ar, bsdtar and
  # llvm-ar wrote (tests/data/make-archives.sh), from a file and from a pipe.
  ar-plugin:
    name: archivey-ar plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync, then install the package over it
        run: |
          uv sync --group dev
          uv pip install -e packages/archivey-ar --no-deps
      - name: Pytest
        run: uv run --no-sync pytest packages/archivey-ar/tests -q --no-cov -rs

  # The short Atheris fuzz (atheris-fuzz.yml in its short mode, three shards), in the
  # merge queue only. The nightly and dispatched full runs stay in that workflow.
  atheris:
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/atheris-fuzz.yml
    with:
      short: true

  # The one required check of the merge queue (ruleset on main). It runs only for a
  # merge_group and fails when any job above failed or was cancelled; a matrix leg with
  # continue-on-error does not count. On a pull request it is skipped, and the
  # always-run pr-gate.yml reports the same name as passed, so a docs-only pull request,
  # which never starts this workflow, can still join the queue. The queue run is the gate.
  gate:
    name: CI gate
    if: ${{ always() && github.event_name == 'merge_group' }}
    needs: [lint, test, test-queue, unar-distro-packages, free-threaded-concurrency, pypy, benchmark, squashfs-plugin, cpio-plugin, ar-plugin, atheris]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI jobs passed."
