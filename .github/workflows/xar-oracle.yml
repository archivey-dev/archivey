# XAR multi-stream oracle (macOS)

# Runs scripts/investigations/xar_multistream_oracle.py against Apple's xar and
# libarchive's bsdtar, which only macOS ships, and puts the table in the run summary.
# Manual only: run it when XAR member decoding changes. dev-docs/formats/xar.md §3
# records the last result.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: macOS / xar multi-stream oracle
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --no-dev
      - name: Run oracle
        run: |
          uv run --no-sync python scripts/investigations/xar_multistream_oracle.py --out results.md
          cat results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: xar-oracle
          path: results.md
