name: Benchmark wall-time

# Wall-time regression tracker for the VISION perf budget. Off the PR path
# (shared-runner wall times are too noisy to block merges) and NOT run per-PR.
# Instead: a daily schedule with a change guard — the expensive run fires when the
# default branch moved recently, or when the last *measurement* is older than ~30 days
# (runner / toolchain drift). On quiet days the job re-publishes the previous JSON
# (with measured_at kept, republished_at stamped) so the next run still knows which
# commit was measured last. `workflow_dispatch` forces a run (optional skip-drift
# measures main alone).
#
# Hard fails (when the expensive run fires):
#   1. ~13× wall-ratio sanity ceiling, when the time past it is at least 1 ms
#   2. a case slower than on the commit the last run measured, both measured in this
#      job on this runner: the two commits alternate, three harness runs each, and
#      benchmarks/compare_refs.py keeps each side's fastest run. A case fails when it
#      is more than 1.25× slower both in wall time and against its stdlib peer, and
#      the gap is at least 1 ms. A case whose fixture changed between the two commits
#      is reported, not gated.
#
# Why the same runner: until 2026-11-20 the job compared this night's ratios with the
# previous night's JSON. Runners differ in speed, and the same commit moved by ~20%
# between two runs (#1686: tar_open_list 2.33x on one runner, 2.86x on the next), so
# the 1.25× gate failed on noise.
#
# Why "pass or fail": the baseline commit is the one the last measuring run timed,
# whatever that run's result. With a successful-only baseline, one failed night froze
# the baseline from 2026-09-06 to 2026-10-09, and every later change added up against
# it until someone re-seeded by hand. Now a real regression fails the first night that
# measures it and then becomes the baseline; the 13× ceiling still fails every night.
# Absolute VISION / Q1 listing bands remain informational prints.
#
# The PR-blocking structural gate (seek baselines + solid decode-once) lives in
# `ci.yml` (`benchmark` job) and runs on every PR.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      skip_drift:
        description: "Skip the comparison with the last measured commit (measure main alone)"
        type: boolean
        default: false

concurrency:
  group: benchmark-wall
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  benchmark-wall:
    name: Full realistic wall-time (nightly if changed)
    runs-on: ubuntu-latest
    # Up to six harness runs of ~1-2 minutes each, plus two syncs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous wall JSON
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "baseline=" >> "$GITHUB_OUTPUT"
          mkdir -p previous-wall
          # The newest completed prior run on the default branch that uploaded our
          # artifact, pass or fail: a failed measurement still uploads its JSON
          # (the upload step runs on always()). Runs with no artifact (cancelled,
          # or stopped before the report) are skipped by the loop below. 100 runs is
          # about 100 days at one scheduled run a day, longer than GitHub's default
          # 90-day artifact retention, so older runs would have nothing to download.
          mapfile -t runs < <(
            gh run list \
              --workflow benchmark-wall.yml \
              --branch "$DEFAULT_BRANCH" \
              --status completed \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          for id in "${runs[@]}"; do
            rm -rf previous-wall
            mkdir -p previous-wall
            if gh run download "$id" -n benchmark-wall-realistic -D previous-wall 2>/dev/null; then
              if [ -f previous-wall/benchmark-wall-realistic.json ]; then
                echo "Found wall artifact from run $id"
                # Say whether the baseline was a red night: after a regression
                # the next green summary otherwise looks like any other.
                conclusion=$(gh run view "$id" --json conclusion --jq .conclusion || echo unknown)
                echo "Baseline: run [$id]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id) (conclusion: $conclusion)." >> "$GITHUB_STEP_SUMMARY"
                echo "found=true" >> "$GITHUB_OUTPUT"
                echo "baseline=previous-wall/benchmark-wall-realistic.json" >> "$GITHUB_OUTPUT"
                echo "source_run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          done
          echo "No previous wall artifact found."

      - name: Decide whether to run
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          PREV_FOUND: ${{ steps.prev.outputs.found }}
          BASELINE: ${{ steps.prev.outputs.baseline }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch — full run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Force a full measurement when provenance is missing or older than
          # ~30 days (keyed off measured_at inside the JSON — not artifact
          # upload time, which re-publish refreshes daily).
          if [ "$PREV_FOUND" = "true" ] && [ -n "$BASELINE" ]; then
            age_s=$(python3 benchmarks/wall_baseline.py age-seconds "$BASELINE")
            max_s=$((30 * 86400))
            if [ "$age_s" -gt "$max_s" ]; then
              echo "measured_at age ${age_s}s > ${max_s}s (~30d) — full run."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "measured_at age ${age_s}s within ${max_s}s."
          else
            echo "No previous measurement — full run (seed)."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise: run only if default-branch HEAD moved since roughly the
          # previous nightly. Cron is daily; 25h gives a 1h margin.
          last=$(git log -1 --format=%ct)
          age=$(( $(date +%s) - last ))
          if [ "$age" -lt 90000 ]; then
            echo "HEAD committed ${age}s ago (< 25h) — full run."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD committed ${age}s ago (>= 25h) and measurement fresh — re-publish skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The commit the last measuring run timed. A re-published artifact keeps the
      # source_sha of its measurement.
      - name: Pick the baseline commit
        id: base
        if: steps.guard.outputs.run == 'true'
        env:
          BASELINE: ${{ steps.prev.outputs.baseline }}
          SKIP_DRIFT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_drift || false }}
        run: |
          sha=""
          if [ "$SKIP_DRIFT" = "true" ]; then
            echo "skip_drift input set: measuring main alone."
          elif [ -z "$BASELINE" ]; then
            echo "No previous baseline: seed run, no comparison."
          else
            sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("source_sha") or "")' "$BASELINE")
            if [ -z "$sha" ]; then
              echo "::warning::The previous artifact names no source_sha: no comparison."
            elif [ "$sha" = "$GITHUB_SHA" ]; then
              echo "The last measurement was of this commit: no comparison."
              sha=""
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -n "$sha" ]; then
            echo "Comparing with ${sha:0:12}, the commit the last measuring run timed." >> "$GITHUB_STEP_SUMMARY"
          fi
      # The baseline's own code runs below (uv sync builds it, the harness is its
      # own), so this checkout keeps no token.
      - name: Check out the baseline commit
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: baseline
          persist-credentials: false

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            baseline/uv.lock
      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        run: uv python install 3.11
      - name: Sync (dev + all extras)
        if: steps.guard.outputs.run == 'true'
        run: uv sync --group dev --extra all
      - name: Sync the baseline (dev + all extras)
        if: steps.base.outputs.sha != ''
        working-directory: baseline
        run: uv sync --group dev --extra all
      # Same as ci.yml benchmark: RAR data cases need RARLAB unrar on the runner.
      - name: Install unrar (RAR data cases)
        if: steps.guard.outputs.run == 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: unrar

      # main's first run is the published artifact and carries the 13x ceiling: the
      # harness exits 1 on it. With a baseline commit, both commits then alternate
      # until each has three runs. Only a missing JSON stops the loop; a baseline
      # harness exits 1 on its own gates, which are not this run's.
      - name: Full realistic wall-time run
        if: steps.guard.outputs.run == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          harness() {
            local dir=$1 out=$2
            (cd "$dir" && uv run --no-sync python -m benchmarks.harness \
              --mode full --scale realistic --warmup \
              --json-out "$out" --text-out "${out%.json}.md")
          }
          status=0
          harness . "$PWD/benchmark-wall-realistic.json" || status=$?
          if [ -n "$BASE_SHA" ]; then
            if [ ! -f benchmark-wall-realistic.json ]; then
              echo "::error::candidate round 1 wrote no JSON (see the log above)"
              exit 1
            fi
            mkdir -p rounds
            cp benchmark-wall-realistic.json rounds/candidate-1.json
            for round in 1 2 3; do
              for side in baseline candidate; do
                [ "$side-$round" = candidate-1 ] && continue
                dir=.
                [ "$side" = baseline ] && dir=baseline
                out="$PWD/rounds/$side-$round.json"
                echo "::group::round $round, $side"
                harness "$dir" "$out" > "${out%.json}.log" 2>&1 || true
                tail -n 5 "${out%.json}.log"
                echo "::endgroup::"
                if [ ! -f "$out" ]; then
                  echo "::error::$side round $round wrote no JSON: $(tail -n 1 "${out%.json}.log")"
                  exit 1
                fi
              done
            done
          fi
          exit "$status"

      - name: Compare with the baseline commit
        if: always() && steps.base.outputs.sha != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          if [ ! -f rounds/baseline-3.json ]; then
            echo "The rounds did not finish: no comparison." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 benchmarks/compare_refs.py \
            --baseline rounds/baseline-*.json \
            --candidate rounds/candidate-*.json \
            --baseline-label "${BASE_SHA:0:12}" \
            --candidate-label "${GITHUB_SHA:0:12}" \
            --band 1.25 --min-ms 1 --fail-on-slower \
            --md-out rounds/compare.md || status=$?
          cat rounds/compare.md >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      - name: Re-publish previous baseline (skip path)
        if: steps.guard.outputs.run == 'false' && steps.prev.outputs.found == 'true'
        env:
          BASELINE: ${{ steps.prev.outputs.baseline }}
        run: |
          python3 benchmarks/wall_baseline.py republish \
            "$BASELINE" \
            .
          echo "Re-published previous wall baseline (measured_at preserved)." >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark-wall-realistic.md ]; then
            cat benchmark-wall-realistic.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish report to job summary
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          if [ -f benchmark-wall-realistic.md ]; then
            cat benchmark-wall-realistic.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark report produced (harness did not write text output)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload wall-time results
        if: always() && (steps.guard.outputs.run == 'true' || (steps.guard.outputs.run == 'false' && steps.prev.outputs.found == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-wall-realistic
          path: |
            benchmark-wall-realistic.md
            benchmark-wall-realistic.json
          if-no-files-found: error
