name: Docs & specs

# The checks that must also run on documentation-only pull requests, which ci.yml's
# path filter skips: the docs site build and the two OpenSpec gates. Moved out of ci.yml
# for that reason; same triggers and job names as before.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: docs-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the API-reference site with mkdocstrings. `--strict` turns broken refs and
  # rendering warnings into failures, so doc rot (a renamed/removed public symbol, a bad
  # cross-reference) fails CI like any other check.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      # Runs before the build because it catches what the build cannot: mkdocs reports
      # published-but-unlisted pages at INFO level and exits 0, which is how six pages
      # stayed URL-reachable and search-indexed while absent from every menu.
      - name: Check docs tree completeness
        run: uv run --python 3.12 --group docs python scripts/check_docs_nav.py
      - name: Check internal markdown links
        # Relative links under dev-docs/ and .claude/skills/ (pair-workflow + skills).
        # Stdlib-only; does not need the docs group.
        run: uv run --python 3.12 --no-sync python scripts/check_internal_md_links.py
      - name: Check the issue forms and pull request template
        # Most files the test reads are .md, which ci.yml's path filter excludes, so ci.yml
        # would skip it on the pull requests that break them. PyYAML is named here so the
        # parse check cannot skip; `-o addopts=` drops coverage and xdist flags.
        run: uv run --python 3.12 --no-sync --with pytest --with pyyaml pytest -o addopts= -p no:cacheprovider tests/test_github_templates.py
      - name: Build docs (strict)
        # --python overrides repo `.python-version` (3.11) so docs actually run on 3.12.
        run: uv run --python 3.12 --group docs mkdocs build --strict
      - name: Check no Sphinx roles leaked into the site
        # --strict cannot see these: to Markdown a Sphinx role is plain text.
        run: python3 scripts/check_docs_rendered.py site

  # The specs under `openspec/specs/` are the authority, but a change only reaches them
  # when someone runs `openspec archive` — a step that was missed three times in a row
  # (#212, #213, #214), each time leaving the authority describing an API or a set of
  # extras that no longer shipped.
  #
  # Runs on pull requests too, since 2026-08. It originally did not, on the reasoning
  # that an implementing PR is *meant* to tick its last task while still unarchived — but
  # that reasoning assumed archiving is a separate step by nature. It is not: most changes
  # here are proposed and implemented in one PR, where archiving in that same PR is simply
  # the right move. Deferring it instead produced a steady stream of bookkeeping PRs whose
  # entire content was `openspec archive` (#214, #215, #222, #227, #238 — five of the
  # thirty-seven merges in three weeks) and a window on main where the authority was wrong.
  #
  # The escape hatch is unchanged and costs one character: a change that is complete but
  # deliberately *not* being archived yet (design still moving under review, or the archive
  # is deliberately batched with a sibling change) leaves its trailing task unchecked. The
  # gate reads finished-ness from the checkboxes, so an unchecked box is an honest
  # "not done yet" rather than a suppression. See CONTRIBUTING.md §"Archiving an OpenSpec
  # change".
  #
  # Expressed as a plain job rather than an `if:` so a manual `workflow_dispatch` also runs
  # it — dispatch is how you ask main for a verdict when the push event never produced a
  # run, and a gate silently missing from that answer would defeat the point.
  openspec:
    name: OpenSpec changes archived
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Stdlib-only script, so no uv sync — the runner's python3 is enough.
      - name: Assert no finished change is left unarchived
        run: python3 scripts/check_openspec_archived.py

  # A separate job rather than a second step in `openspec`, so each check keeps meaning
  # exactly what its name says, which matters if branch protection ever requires one.
  openspec-self-reference:
    name: OpenSpec spec prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Stdlib-only script, so no uv sync — the runner's python3 is enough.
      - name: Assert no spec prose refers to "this change"
        run: python3 scripts/check_openspec_self_reference.py
