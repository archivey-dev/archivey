name: Writer timestamp probe

# Runs scripts/investigations/exploration/probe_writer_timestamps.py on Linux, macOS and Windows to record which
# file time each ZIP/7z writer stores in its creation-time slots. Results feed
# dev-docs/investigations/writer-timestamp-slots.md. Runs on demand, and on PRs only
# when the probe itself changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/investigations/exploration/probe_writer_timestamps.py
      - .github/workflows/writer-timestamps.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archivey (core only)
        run: python -m pip install .
      - name: Install writers (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: 7zip p7zip-full libarchive-tools zip
      - name: Install writers (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip p7zip || brew install sevenzip
      - name: Install writers (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install zip -y --no-progress
      - name: Run probe
        shell: bash
        run: |
          mkdir -p probe-out
          python scripts/investigations/exploration/probe_writer_timestamps.py --out probe-out \
            --json "probe-out/results-${{ runner.os }}.json" | tee probe-out/report.md
          cat probe-out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: writer-timestamps-${{ runner.os }}
          path: probe-out/
