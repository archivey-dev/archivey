name: Install apt packages (cached)
description: >
  Installs Ubuntu packages from .deb files kept in the Actions cache, and only
  contacts the Ubuntu mirror when the cache has no entry for this runner image and
  package list. A cache hit installs offline, so a mirror outage cannot fail the job,
  and the job does not download the package indexes again.
inputs:
  packages:
    description: Space-separated package names, as given to apt-get install.
    required: true
  install-recommends:
    description: "'false' passes --no-install-recommends."
    default: "true"
runs:
  using: composite
  steps:
    # The key names the runner image: its preinstalled packages decide which
    # dependencies apt downloads, so a new image starts a new cache entry.
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RECOMMENDS: ${{ inputs.install-recommends }}
      run: |
        set -euo pipefail
        list=$(printf '%s\n' $PACKAGES | sort -u | tr '\n' ' ')
        hash=$(printf '%s|%s' "$list" "$RECOMMENDS" | sha256sum | cut -c1-16)
        echo "key=apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH}-${hash}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/apt-debs-${hash}" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RECOMMENDS: ${{ inputs.install-recommends }}
        DEBS: ${{ steps.key.outputs.dir }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        flags=(-y -q -o Acquire::Retries=3)
        [ "$RECOMMENDS" = false ] && flags+=(--no-install-recommends)
        export DEBIAN_FRONTEND=noninteractive
        if [ "$HIT" = true ] && compgen -G "$DEBS/*.deb" > /dev/null; then
          # Offline: every package and dependency the image lacks is in $DEBS.
          if sudo apt-get install "${flags[@]}" --no-download "$DEBS"/*.deb; then
            echo "saved=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Cached .deb files did not install; fetching from the mirror."
        fi
        # Miss: download into $DEBS (only what the image lacks), then install from it.
        rm -rf "$DEBS" && mkdir -p "$DEBS/partial"
        sudo apt-get update -q -o Acquire::Retries=3
        sudo apt-get install "${flags[@]}" --download-only \
          -o Dir::Cache::archives="$DEBS" $PACKAGES
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u)" "$DEBS"
        if compgen -G "$DEBS/*.deb" > /dev/null; then
          sudo apt-get install "${flags[@]}" --no-download "$DEBS"/*.deb
          echo "saved=yes" >> "$GITHUB_OUTPUT"
        else
          # The image already has every package: nothing to cache.
          echo "saved=skip" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.install.outputs.saved == 'yes'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
