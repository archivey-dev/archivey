name: Install apt packages (cached)
description: >
  Installs Ubuntu packages from .deb files kept in the Actions cache. A cache hit
  does not contact the Ubuntu mirror or download the package indexes. The first run
  on a new runner image (about weekly), and the fallback after a cached install
  fails, still use the mirror, so a mirror outage can still fail those runs.
inputs:
  packages:
    description: Space-separated package names, as given to apt-get install.
    required: true
  install-recommends:
    description: "'false' passes --no-install-recommends."
    default: "true"
runs:
  using: composite
  steps:
    # The key names the runner image: its preinstalled packages decide which
    # dependencies apt downloads, so a new image starts a new cache entry. It also
    # names this file, because a cache entry cannot be overwritten: a change to how
    # entries are filled must not restore the old ones.
    # A hit installs the package versions from the run that first saved the key, so
    # an Ubuntu update to a cached package reaches CI only when GitHub rolls out a
    # new runner image (ImageVersion, about weekly).
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RECOMMENDS: ${{ inputs.install-recommends }}
      run: |
        set -euo pipefail
        list=$(printf '%s\n' $PACKAGES | sort -u | tr '\n' ' ')
        self=$(sha256sum "$GITHUB_ACTION_PATH/action.yml" | cut -c1-64)
        hash=$(printf '%s|%s|%s' "$list" "$RECOMMENDS" "$self" | sha256sum | cut -c1-16)
        echo "key=apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH}-${hash}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/apt-debs-${hash}" >> "$GITHUB_OUTPUT"
    # A cache-service error must not fail the job: it only means a miss.
    - id: cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
    - id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        RECOMMENDS: ${{ inputs.install-recommends }}
        DEBS: ${{ steps.key.outputs.dir }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        flags=(-y -q -o Acquire::Retries=3)
        [ "$RECOMMENDS" = false ] && flags+=(--no-install-recommends)
        # apt takes a named .deb from its archive directory only when that directory
        # is $DEBS; otherwise it fetches the same version from the mirror, and
        # --no-download then refuses. With both set, an install never goes online.
        # sudo resets the environment, so DEBIAN_FRONTEND goes through env.
        apt=(sudo env DEBIAN_FRONTEND=noninteractive apt-get)
        local_install=("${apt[@]}" install "${flags[@]}" --no-download
          -o Dir::Cache::archives="$DEBS")
        if [ "$HIT" = true ] && compgen -G "$DEBS/*.deb" > /dev/null; then
          # $DEBS holds what this step needed on top of the system as it was when
          # the entry was saved. If that is not enough, the install fails offline
          # and the miss path below runs.
          if "${local_install[@]}" "$DEBS"/*.deb; then
            echo "saved=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Cached .deb files did not install; fetching from the mirror."
        fi
        # Miss: download into $DEBS (only what the system lacks), then install from it.
        # apt downloads as _apt, which must be able to write there.
        sudo rm -rf "$DEBS" && mkdir -p "$DEBS/partial" && chmod a+rwx "$DEBS" "$DEBS/partial"
        # A dead mirror makes apt retry every mirror and file for many minutes (17 on
        # 11-11, until the job timed out), so each network call gets 2 minutes. A
        # working mirror takes seconds.
        timeout 120 "${apt[@]}" update -q -o Acquire::Retries=3
        timeout 120 "${apt[@]}" install "${flags[@]}" --download-only \
          -o Dir::Cache::archives="$DEBS" $PACKAGES
        saved=skip  # The system may already have every package: nothing to cache.
        if compgen -G "$DEBS/*.deb" > /dev/null; then
          "${local_install[@]}" "$DEBS"/*.deb
          saved=yes
        fi
        # apt's lock and partial/ are root's; the cache saves only the .deb files.
        # The output comes last, so a failed cleanup cannot leave saved=yes behind.
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u)" "$DEBS"
        chmod 755 "$DEBS"
        echo "saved=$saved" >> "$GITHUB_OUTPUT"
    - if: steps.install.outputs.saved == 'yes'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
