# Preferred (works with Cursor Cloud's remapped hooksPath):
#   ./scripts/install-git-hooks.sh
# Alternative (framework install; may conflict with remapped hooksPath):
#   uv run pre-commit install
# Run on demand: `uv run pre-commit run --all-files`
#
# Paths match CI (`.github/workflows/ci.yml` ruff check / format --check).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|scripts|benchmarks)/
      - id: ruff-format
        files: ^(src|tests|scripts|benchmarks)/
  # Markdown lines a commit adds stay within 100 columns (scripts/checks/check_line_width.py).
  - repo: local
    hooks:
      - id: line-width
        name: line width (added Markdown lines)
        entry: python3 scripts/checks/check_line_width.py --staged
        language: system
        pass_filenames: false
        files: \.md$
