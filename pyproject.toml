[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivey"
version = "0.3.0.dev0"
description = "Python library for reading, streaming, and safely extracting archives"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Davi Figueiredo", email = "archivey@davitf.com" }
]
keywords = [
    "archive", "zip", "tar", "rar", "7z", "iso",
    "compression", "decompression", "extract", "streaming",
]
# Development Status is a judgement call, not a fact: 4 = "the API is settling but not
# frozen", which is what a pre-1.0 first public release is. Bump to 5 at 1.0.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Shown in the PyPI sidebar. Without these the project page links nowhere, which is
# most of why relative README links were the only navigation.
[project.urls]
Homepage = "https://archivey-dev.github.io/archivey/"
Documentation = "https://archivey-dev.github.io/archivey/"
Source = "https://github.com/archivey-dev/archivey"
Changelog = "https://github.com/archivey-dev/archivey/blob/main/CHANGELOG.md"
Issues = "https://github.com/archivey-dev/archivey/issues"

[project.scripts]
archivey = "archivey.cli.main:main"

# Four extras, each answering a question a user asks about their own environment
# ("will it just work?", "do I need fast seeking?", "am I on free-threaded Python?",
# "give me everything") rather than naming an internal dependency group. The previous
# format-named table ([7z], [rar], [crypto], [iso], [zstd], [lz4], [cli],
# [recommended-lite]) was capability-scoped in fact — [7z] was a codec bundle shared with
# ZIP and TAR, [rar] was byte-identical to [crypto] — so install hints named the wrong
# thing. Removed names must NOT come back as aliases: an extra, once published, can never
# be removed. See openspec/specs/packaging-and-extras/spec.md.
[project.optional-dependencies]
recommended = [
    # >=1.3.1: 1.1.x/1.2.0 return silently wrong bytes on chunked bounded PPMd
    # decodes (premature eof mid-stream); 1.3.1 fixes that.
    "pyppmd>=1.3.1",
    "inflate64>=1.0.0",
    "backports.zstd>=1.0.0; python_version < '3.14'",
    # >=1.2.0: process(output_buffer_limit=) / can_accept_more_data (CVE-2025-6176).
    # >=1.2.1: decoder buffer overflow fix (CVE-2026-111497).
    "brotli>=1.2.1",
    "lz4>=4.4.5",
    # AES block operations only (7z, RAR headers, WinZip AES ZIP); PBKDF2/SHA/HMAC are
    # stdlib. RAR5 BLAKE2sp is native on hashlib (internal/hashing/blake2sp.py) and needs
    # no package at all.
    "cryptography>=45.0.0",
    "pycdlib>=1.22.0",
    "tqdm>=4.67.0",
]
# rapidgzip backs BOTH gzip (RapidgzipFile) and bzip2 (its bundled IndexedBzip2File). The
# separate indexed_bzip2 package is deliberately NOT a dependency: loading both libraries into
# one process corrupts the heap and aborts on macOS (overlapping statically-linked C++ symbols).
# >=0.16.0 is the floor known to expose IndexedBzip2File. See ADR 0008 and
# dev-docs/investigations/rapidgzip-upstream-report.md §7.
#
# Kept OUT of [recommended] on purpose: it is a heavy native build that can fail to compile.
# archivey imports it only in its decoder process, so the caller's process (and its GIL on a
# free-threaded build) is unaffected.
seekable = [
    "rapidgzip>=0.16.0",
]
# The measured subset that leaves sys._is_gil_enabled() False after import on a
# free-threaded build — NOT a claim that archivey is only free-thread-safe with it.
# Membership is a property of the ecosystem, not of archivey, so it is expected to widen
# and may eventually collapse into [recommended]. CI installs exactly this set on 3.13t
# (required) and 3.15t (allowed to fail), and tests/check_free_threaded_gil.py imports
# whatever this list resolves to there and asserts the GIL is still off, so it cannot rot
# silently on 3.13t.
#
# cryptography is version-conditional: its cffi dependency refuses to build on
# free-threaded 3.13 ("Upgrade to free-threaded 3.14 or newer") and works on 3.14t with
# the GIL still disabled. That gap is also why `pip install archivey[recommended]` fails
# on 3.13t — documented in docs/install.md, not worked around.
free-threaded = [
    "pycdlib>=1.22.0",
    "lz4>=4.4.5",
    "tqdm>=4.67.0",
    "backports.zstd>=1.0.0; python_version < '3.14'",
    "cryptography>=45.0.0; python_version >= '3.14'",
]
# The conventional "everything" name. Unlike before, it is now a strict superset of
# [recommended] rather than an alias for it. After the compression-library evaluation
# (dev-docs/library-analysis.md) two dead backends were dropped from the extras —
# python-xz (v2 reads XZ with its own native xz.py over stdlib lzma; archivey-dev#214 —
# never imported) and pyzstd (the zstd decode decision is stdlib compression.zstd /
# backports.zstd; it was only a test-fixture generator and is now in the dev group).
# tests/test_extras_imported.py guards against a dead dependency slipping back in.
all = [
    "archivey[recommended,seekable]",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    # Runs the suite on every core (`-n auto`): scripts/test.sh and CI pass it. Not in
    # addopts, so a single-test run does not pay for starting workers.
    "pytest-xdist>=3.6.0",
    # Lint and type checkers are pinned EXACTLY, not floored. Their version decides
    # what the gates *report*, so a floor makes two developers — or the same developer
    # across dependency configs — disagree about whether the tree is clean. Concretely:
    # `uv sync --resolution lowest-direct` (the [all-lowest] CI leg, and step 2 of
    # CONTRIBUTING's three-config rule) resolved `ruff>=0.11.0` to 0.11.0, which reported
    # 367 "errors" the current version does not, on an unchanged tree. `ruff format` also
    # changes output between versions, so a floor lets one contributor reformat the repo
    # just by having a newer one. Bump these deliberately, together, in their own commit.
    #
    # Keep `ruff` in step with the `rev:` in .pre-commit-config.yaml — the framework hook
    # path resolves its own copy. tests/test_tooling_pins.py enforces that.
    "pyrefly==1.4.0",
    "ty==0.0.90",
    "ruff==0.17.1",
    "pre-commit>=4.0.0",
    # tests/test_release_script.py reads the workflow files with it.
    "pyyaml>=6.0",
    "coverage[toml]>=7.6.0",
    # >=1.1: earlier releases pin pyppmd<1.3.0, the range the pyppmd>=1.3.1 floor
    # above rules out (wrong bytes on chunked PPMd decodes). Needed by
    # tests/test_sevenzip_reader.py::test_py7zr_codec_fixtures_roundtrip[ppmd] and
    # ::test_encrypted_ppmd_chunked_reads_roundtrip.
    "py7zr>=1.1.0",
    "rarfile>=4.2",
    # libarchive-c is a dev-only cross-validation oracle for optional corpus tests
    # (tests/test_libarchive_corpus.py); it is not a runtime backend.
    "libarchive-c>=5.0.0",
    # Stdlib compression.zstd on 3.14+; backports only needed below that.
    "backports.zstd>=1.0.0; python_version < '3.14'",
    "lz4>=4.4.5",
    "brotli>=1.2.1",
    # pycdlib (the [iso] extra) is in the dev group like the other optional format libs, so
    # the ISO backend's tests run in the default dev env and the type checkers can resolve the
    # PyCdlibIO annotation. The core-only CI leg installs with --no-dev, so it stays absent
    # there and the zero-dep core / graceful-degradation paths are still exercised.
    "pycdlib>=1.22.0",
    # ncompress is a test-only LZW *compressor* used to generate .Z fixtures for the
    # native unix-compress decoder (core; decode-only).
    "ncompress>=1.0.0",
    "cryptography>=45.0.0",
    # Exercise real third-party stream objects in tests/test_stream_inputs.py: urllib3 is
    # what requests' response.raw is (the canonical file-like network input); fsspec's file
    # objects are ubiquitous in data pipelines (local/S3/GCS/HTTP behind one interface).
    "urllib3>=2.0.0",
    "fsspec>=2024.0.0",
    # Property-based tests for the safety logic (tests/test_property_safety.py); mirrors
    # the mutation harness as the second pre-Phase-6 fuzzing-scaffold gate.
    "hypothesis>=6.100.0",
    # tqdm ([cli] extra) — listed here like pycdlib so a local `uv sync --group dev`
    # can type-check the CLI progress helper. CI lint uses `--extra all` (see
    # .github/workflows/ci.yml) so every optional dep is resolved for pyrefly/ty.
    # Runtime still degrades cleanly when tqdm is absent (ImportError → no bar).
    "tqdm>=4.67.0",
]
# Documentation toolchain. Kept out of `dev` so the common lint/test loop stays light;
# build the site with `uv run --group docs mkdocs build --strict`.
docs = [
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-autorefs>=1.2.0",
    "mkdocs-material>=9.6.0",
    "griffe-fieldz>=0.2.1",
    # Writes llms.txt, llms-full.txt and a Markdown copy of each page for coding
    # agents. Capped below 0.6: a 0.x release may change the output format.
    "mkdocs-llmstxt>=0.5.1,<0.6",
]
# Coverage-guided fuzz harness (Atheris / libFuzzer). CI-only: never a user-facing
# runtime extra and never folded into `[all]` — see packaging-and-extras + threat-model O5.
# Install with `uv sync --group fuzz` (plus `--group dev --extra all` for seed fixtures).
fuzz = [
    # 3.1+ drops cp311 wheels; keep 3.0.x on 3.11, allow latest on 3.12+.
    "atheris>=3.0.0,<3.1; python_version < '3.12'",
    "atheris>=3.0.0; python_version >= '3.12'",
]

# The sdist carries what a build needs, plus the changelog. Without this list hatch
# packs every tracked file (openspec/, review/, dev-docs/, .claude/, tests/ ...), which
# made the 0.2.0rc1 sdist about 7.5 MB. tests/ stays out on purpose: it would add about
# 2.3 MB, and dozens of its tests read files that exist only in a git checkout (scripts/,
# review/, openspec/, .github/), so the suite does not pass from an unpacked sdist. Run
# the tests from the git tag instead. hatch adds pyproject.toml, PKG-INFO and the
# repo-root .gitignore. publish.yml's build job fails when the sdist holds another
# top-level path; tests/test_sdist_contents.py ties its list to this one.
[tool.hatch.build.targets.sdist]
only-include = ["src", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 grew its default set from 59 rules to 413 (bugbear, simplify, RUF, a pylint
# and a bandit subset, refurb, pie, pyi, …); we take all of it. It also dropped some
# pycodestyle E4/E7 and pyflakes rules from the defaults. "F" on the first line already
# selects every pyflakes rule; the second line restores the E4/E7 ones. E902 (E9) is
# still in the default set.
extend-select = [
    "I", "F", "C4", "ISC", "RET", "BLE", "UP",
    "E401", "E402", "E701", "E702", "E703", "E711", "E712", "E713", "E714", "E721",
    "E731", "E741", "E742", "E743",
]

[tool.ruff.lint.isort]
# One `from m import (...)` per module, aliases included (`Set as AbstractSet`).
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
# Immutable values, safe as argument and dataclass defaults (B008, RUF009): an enum.Flag
# and a frozen dataclass of ints.
# `archivey.internal.config` re-exports DecoderLimits, so both paths are listed.
extend-immutable-calls = [
    "archivey.types.MemberStreams",
    "archivey.config.DecoderLimits",
    "archivey.internal.config.DecoderLimits",
]

[tool.ruff.lint.per-file-ignores]
# This survey promises to run on a bare Python 3.8+ interpreter, so the UP rules, which
# assume the package's py311 floor, don't apply to it.
"scripts/exploration/brotli_probe_field_survey.py" = ["UP"]
# The ISO reader patches pycdlib's parsers in place and reads a few of its private
# attributes. Through setattr/getattr the checkers see `object`; a plain assignment or
# attribute read would need a pyrefly and a ty suppression on every line instead.
"src/archivey/internal/backends/iso_reader.py" = ["B009", "B010"]

[tool.pyrefly]
search-path = ["src", "packages/archivey-squashfs/src"]
project-includes = ["src", "packages/archivey-squashfs/src"]
python_version = "3.11"

# pycdlib is py.typed but declares its signatures in PEP 484 type comments
# (`# type: () -> int`), which Pyrefly does not read. From 1.4 Pyrefly instead infers
# each return type from the body, and the inference is wrong in ways the comments are
# not: `DirectoryRecord.extent_location()` comes out `int | None` because
# `orig_extent_loc` starts as None in `__init__`. Treat pycdlib's unannotated
# functions as returning Any, as Pyrefly 1.1 effectively did and as ty does (it
# reports these calls' results as Unknown).
[[tool.pyrefly.sub-config]]
matches = "**/pycdlib/**"
untyped-def-behavior = "skip-and-infer-return-any"

[tool.ty]
# ty is Astral's own from-scratch type checker (not pyright/mypy-based). The library
# is kept clean on both ty and Pyrefly.
[tool.ty.environment]
python-version = "3.11"
root = ["src", "packages/archivey-squashfs/src"]

[tool.ty.src]
# Type-check the library and the in-repo plugin packages, mirroring pyrefly's
# `project-includes`, so a bare `uv run ty check` is the gate with no path arguments.
include = ["src", "packages/archivey-squashfs/src"]

[tool.ty.rules]
# Every method that overrides one of a base class carries ``@override``
# (archivey.internal.overrides); ``invalid-explicit-override``, on by default, refuses
# the decorator on a method that overrides nothing.
missing-override-decorator = "error"

[[tool.ty.overrides]]
# The CLI and the plugin packages use only archivey's public API, which has no
# ``override``. tests/test_cli_uses_public_api.py checks that for the CLI; no test
# checks it for the plugin packages. The CLI's overrides are of stdlib
# classes, which an archivey rename cannot strand. The plugins' are of archivey's own
# hooks, and one is unprotected: ``FormatReader.archive_info`` has a default, so a
# rename leaves each plugin's override silently unused. The packages are being folded
# into the library, where the rule covers their readers.
include = ["src/archivey/cli/**", "packages/**"]
[tool.ty.overrides.rules]
missing-override-decorator = "ignore"

[tool.coverage.run]
source = ["archivey"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
testpaths = ["tests"]
# --timeout: a hung test fails fast (with a traceback of all threads) instead of stalling
# the whole job until the CI hard limit. 60s is far above any real test here (all run in
# milliseconds), so only a genuine hang trips it.
# --cov-branch repeats `branch = true` for child processes. It matters only on pytest-cov
# before 7 (the lowest-direct resolution), which measures a child `python` through its
# COV_CORE_* variables. `--cov-config` defaults to `.coveragerc`, which this repo does not
# have, so the child searches for a config in its own working directory; one started in a
# temporary directory finds none, writes statement-only data, and the final combine
# refuses to merge that with branch data. Other [tool.coverage.run] keys do not reach such
# a child either. No CI leg can catch the flag's loss (the one leg that measures coverage
# runs pytest-cov 7, which measures no child), and it is inert once the pytest-cov floor
# reaches 7. It sits in addopts despite the timeout_method rule below because pytest-cov
# has no ini key, and every site that overrides addopts drops --cov along with it.
addopts = "--cov=archivey --cov-branch --cov-report=term-missing --cov-report=xml --timeout=60 -m 'not ppmd_native_stress'"
# thread, not pytest-timeout's POSIX default of signal. SIGALRM is delivered to the main
# thread and only runs when it next reaches the interpreter, so a thread blocked in C or a
# deadlock off the main thread is invisible to it: on 2026-09-21 both the free-threaded job
# and an ordinary `py3.14 / core-only` job hung with --timeout armed, printed nothing for
# twenty minutes, and were killed by timeout-minutes with no idea which test was running.
# The thread method arms a threading.Timer instead, which needs the GIL only momentarily
# to dump every thread's stack and then call os._exit(1), so it survives cases the alarm
# does not. The bound is narrow: a native call that *releases* the GIL, which is most
# blocking I/O, is caught fine, and on a free-threaded build the GIL is not the
# serialising thing at all. Both methods lose only when the GIL is held for the whole
# hang — the accelerator busy-loop in dev-docs/threat-model.md is exactly that shape, and
# no per-test timeout will ever name it.
# In a serial run the cost is that the whole run dies with the timeout instead of one
# test failing alone. That cost is known to be acceptable rather than merely argued:
# pytest-timeout falls back to this method where there is no SIGALRM, so Windows CI paid
# it for years and nobody noticed; a GIL-held hang costs the whole job anyway.
# Under pytest-xdist (`-n auto`, which CI and scripts/test.sh pass) the blast radius
# shrinks: only the worker dies, xdist replaces it, the named test fails and the run
# goes on. What is lost is the stack dump, which does not reach the output (xdist
# reports the nodeid and "node down", nothing more). Re-run that test with `-n 0`.
# This is a diagnostic, not a fix; the hang itself is tracked internally.
# It is an ini option rather than an addopts flag on purpose. Five pytest entry points
# override addopts — the two free-threaded CI steps, the PPMd stress workflow,
# scripts/ci_run_native_modules.py and the hand-run recipe in dev-docs/known-issues.md —
# and a flag inside addopts would be dropped by every one of them, leaving a rule that
# each new override site must remember to repeat it. The ini key is untouched by
# `-o addopts=`, so they all inherit it and none of them names it.
timeout_method = "thread"
# A per-test timeout also covers fixture setup and teardown: a module-scoped fixture's
# setup counts against the first test that uses it on a worker, and its teardown against
# the last test of the module there, often an unrelated one on the 60 s default. A slow
# module fixture once killed a Windows xdist worker that way, with no traceback. Keep
# module fixtures fast, or mark the test `@pytest.mark.timeout(N, func_only=True)` so the
# budget covers only the test body.

markers = [
    "sample_archives: declarative parametrization over sample archives and config variants",
    "concurrent_reader: post-materialization MemberStreams.CONCURRENT seam (also run under free-threaded CI)",
    "ppmd_native_stress: PPMd native stress (non-blocking PPMd native stress workflow only)",
    "allow_resource_leaks: skip the leak-oracle fail for this test (still reaps)",
]
