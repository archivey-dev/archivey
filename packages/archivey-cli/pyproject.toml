# The `archivey` command with every optional package that installs everywhere, so
# `uvx archivey-cli` (or `pipx install archivey-cli`) gets the full CLI in one name.
# Python packaging has no default extras, so `uvx archivey` alone runs the core install.
#
# This distribution holds no code: it is metadata plus two console scripts that point at
# the CLI inside `archivey`. Its version moves in lockstep with the root pyproject.toml,
# and the dependency pins that same version; tests/test_cli_companion_package.py checks
# both, and publish.yml builds and uploads it beside `archivey`.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "archivey-cli"
version = "0.5.2.dev0"
description = "The archivey command-line tool, with archivey's recommended optional packages and its parallel decoders"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Davi Figueiredo", email = "archivey@davitf.com" }
]
keywords = ["archive", "zip", "tar", "rar", "7z", "iso", "extract", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "archivey[recommended]==0.5.2.dev0",
    # URL arguments (`archivey list https://…`): the CLI reads them through fsspec, and
    # fsspec's http/https backend needs aiohttp. The library itself adds no dependency or
    # extra for them; other stores (s3fs, gcsfs, adlfs) stay the user's to install.
    "fsspec>=2024.0.0",
    "aiohttp>=3.9.0",
    # The root's [bzip3] and [seekable], only where they install from a wheel, so that
    # `uvx archivey-cli` reads .bz3 and decodes large gzip and bzip2 in parallel without
    # ever compiling. Elsewhere the CLI installs without them, and `--version -v` says
    # how to add them. The floors match the root extras
    # (tests/test_cli_companion_package.py checks).
    # bzip3 0.1.10 has CPython 3.11 to 3.14 wheels for Linux x86-64, aarch64 and
    # riscv64 (glibc and musl) and for Windows, and no sdist. Its libbzip3 is LGPL-3.
    "bzip3>=0.1.10; platform_python_implementation == 'CPython' and python_version < '3.15' and (sys_platform == 'win32' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'riscv64')))",
    # rapidgzip 0.16.0 has CPython 3.11 to 3.14 wheels for Linux x86-64, aarch64 and
    # i686, macOS 13+ (arm64 and x86-64) and Windows x86-64 (not 3.14t there, which
    # builds from its sdist). Under PyPy archivey does not use it.
    "rapidgzip>=0.16.0; platform_python_implementation == 'CPython' and python_version < '3.15' and (sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'i686')))",
]

[project.urls]
Homepage = "https://archivey-dev.github.io/archivey/"
Documentation = "https://archivey-dev.github.io/archivey/cli/"
Source = "https://github.com/archivey-dev/archivey"
Changelog = "https://github.com/archivey-dev/archivey/blob/main/CHANGELOG.md"
Issues = "https://github.com/archivey-dev/archivey/issues"

# `archivey-cli` is there so `uvx archivey-cli` works: uvx runs the command named after
# the package. `archivey` is the name people type after `pipx install archivey-cli`.
[project.scripts]
archivey = "archivey.cli.main:main"
archivey-cli = "archivey.cli.main:main"

# No packages of its own: the wheel carries only metadata and the entry points.
[tool.hatch.build.targets.wheel]
bypass-selection = true
