[package]
name = "archivey-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
