[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "archivey-codecs"
dynamic = ["version"]
description = "Rust codecs with a standard-library-shaped Python API, used by archivey"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/archivey-dev/archivey"
Changelog = "https://github.com/archivey-dev/archivey/blob/main/packages/archivey-codecs/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "archivey_codecs._codecs"
features = ["pyo3/extension-module"]
