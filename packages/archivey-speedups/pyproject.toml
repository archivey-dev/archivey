[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "archivey-speedups"
dynamic = ["version"]
description = "Native (Rust) speedups for archivey: faster versions of its pure-Python decoders"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/archivey-dev/archivey"
Changelog = "https://github.com/archivey-dev/archivey/blob/main/packages/archivey-speedups/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "archivey_speedups._speedups"
features = ["pyo3/extension-module"]
